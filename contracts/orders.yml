# Order count. Half of the revenue identity: net_revenue = orders x aov.
kpi_id: orders
version: 1
owner_role: commercial_director
unit: count
definition: Count of completed orders, excluding cancellations and test accounts.

calculation:
  canonical_sql: |
    SELECT date_trunc('day', order_ts) AS d,
           region, channel, category, device,
           COUNT(DISTINCT order_id) AS value
    FROM pos_txn
    WHERE status <> 'cancelled' AND is_test = FALSE
    GROUP BY 1, 2, 3, 4, 5
  dialect_targets: [duckdb, databricks, snowflake]

grain:
  time: day
  dims: [region, channel, category, device]

calendar: fiscal_in
parents: [net_revenue]
children: [checkout_conversion]
dimensions: [region, channel, category, device]

drivers:
  - id: marketing_spend
    source: plan_ops
    controllable_lever: media_budget
    owner_role: marketing_lead
    elasticity_prior: 0.4
  - id: stock_position
    source: plan_ops
    controllable_lever: replenishment
    owner_role: supply_planner
  - id: severe_weather
    source: ext_signals

materiality:
  min_abs_robust_z: 3.0
  min_abs_delta_inr: 15000
  # One order is worth the average order value, Rs 447 on this data.
  value_per_unit_inr: 447.0

freshness_sla:
  pos_txn: 6h
  plan_ops: 72h
  ext_signals: 36h

access_policy:
  row_filter: "region IN :entitled_regions"
  domain_restriction: [pii]

lineage:
  upstream: [pos_txn.orders]
  # tz_normalise as well as the other two. The East extract lands in local time,
  # and without the correction its last few hours fall into a day after the
  # series ends -- a partial day holding roughly half the usual count, which the
  # detector reads as a collapse. `net_revenue` is built from the same
  # timestamps and has always corrected it; a count derived from them has to as
  # well (B-019 defect 6, found in the other two verticals first).
  transforms: [dedupe_order_id, tz_normalise, exclude_test_accounts]
