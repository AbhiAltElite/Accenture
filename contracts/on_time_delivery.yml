# On-time delivery. Arrives from a third source on a T+1 cadence, so it is the
# metric most likely to be stale when a diagnosis runs, which makes it the
# natural place to demonstrate the freshness gate.
kpi_id: on_time_delivery
version: 1
owner_role: supply_planner
unit: ratio
definition: >
  Share of shipments delivered on or before the promised date. Undelivered
  shipments past their promise date count as late; shipments still within their
  window are excluded rather than assumed on time.

calculation:
  canonical_sql: |
    SELECT date_trunc('day', promised_date) AS d,
           region, category,
           AVG(CASE WHEN delivered_date <= promised_date THEN 1.0 ELSE 0.0 END) AS value,
           SUM(CASE WHEN delivered_date <= promised_date THEN 1.0 ELSE 0.0 END) AS on_time,
           COUNT(*)::DOUBLE AS shipments
    FROM shipments
    WHERE delivered_date IS NOT NULL OR promised_date < CURRENT_DATE
    GROUP BY 1, 2, 3
  dialect_targets: [duckdb, databricks, snowflake]

grain:
  time: day
  dims: [region, category]
  # A rate. Rolling up re-divides the summed parts: a category with nine
  # shipments must not weigh as much as one with nine thousand.
  aggregation: ratio_of_sums
  numerator: on_time
  denominator: shipments

calendar: fiscal_in
parents: []
children: []
dimensions: [region, category, carrier]

drivers:
  - id: carrier_performance
    source: plan_ops
    controllable_lever: carrier_mix
    owner_role: supply_planner
  - id: stock_position
    source: plan_ops
    controllable_lever: replenishment
    owner_role: supply_planner
  - id: severe_weather
    source: ext_signals

materiality:
  min_abs_robust_z: 2.5
  min_abs_delta_inr: 15000
  # A ratio again: one whole unit is every shipment moving from on time to
  # late. Costed at half a region-day of revenue, covering both the orders
  # cancelled or credited now and the retention lost afterwards. Costing it at
  # only the immediate credits understates a metric whose damage is mostly
  # deferred.
  value_per_unit_inr: 91858.0

freshness_sla:
  plan_ops: 72h
  ext_signals: 36h

access_policy:
  row_filter: "region IN :entitled_regions"

# No process document registered for this metric yet, so coverage is unknown and
# Answer 2 will decline to assert a gap rather than infer one from silence.
# The same S&OP document governs this KPI: section 3 step 3 is the supply
# reconciliation that plans distribution capacity, and on-time delivery is what
# that plan delivers. The spans are the same four because they are the cycle's
# whole input list, and that list is the finding. A process that plans
# distribution against sales history, stock and capacity, and against no
# external disruption signal at all, cannot anticipate a flood.
signals_consumed:
  derived_from: data/docs/sop/sop_demand_planning_v2.md
  coverage: complete
  extracted_at: 2026-08-28T09:14:00Z
  extracted:
    - {signal: historical_sales, span: [429, 525]}
    - {signal: inventory_position, span: [526, 618]}
    - {signal: capacity_metrics, span: [619, 692]}
    - {signal: financial_plan, span: [693, 763]}

lineage:
  upstream: [shipments]
  transforms: [exclude_in_flight]
