# Checkout conversion. Deliberately at a different grain and cadence from its
# parent: hourly, digital channels only. Comparing it to a daily all-channel
# metric is exactly the reconciliation the engine has to get right.
kpi_id: checkout_conversion
version: 1
owner_role: ecommerce_lead
unit: ratio
definition: >
  Completed orders divided by checkout sessions started, digital channels only.
  Store transactions have no session and are excluded rather than counted as
  converting.

calculation:
  canonical_sql: |
    WITH sess AS (
      SELECT date_trunc('hour', session_ts) AS h, region, device,
             SUM(sessions) AS sessions
      FROM sessions WHERE channel IN ('web','app') GROUP BY 1,2,3
    ), ord AS (
      SELECT date_trunc('hour', order_ts) AS h, region, device,
             COUNT(DISTINCT order_id) AS orders
      FROM pos_txn WHERE status <> 'cancelled' AND channel IN ('web','app')
      GROUP BY 1,2,3
    )
    SELECT s.h AS h, s.region, s.device,
           COALESCE(o.orders, 0)::DOUBLE / NULLIF(s.sessions, 0) AS value,
           COALESCE(o.orders, 0)::DOUBLE AS converted,
           s.sessions::DOUBLE AS sessions
    FROM sess s LEFT JOIN ord o USING (h, region, device)
  dialect_targets: [duckdb, databricks, snowflake]

grain:
  time: hour
  dims: [region, device]
  # A rate. Rolling up re-divides the summed parts: the mean of slice rates
  # would weight a device that took 200 sessions like one that took 200,000.
  aggregation: ratio_of_sums
  numerator: converted
  denominator: sessions

calendar: fiscal_in
parents: [orders]
children: []
dimensions: [region, device, channel]

drivers:
  - id: app_release
    source: voice_ops
    controllable_lever: release_rollback
    owner_role: ecommerce_lead
  - id: payment_gateway_health
    source: voice_ops
    controllable_lever: gateway_failover
    owner_role: platform_lead
  - id: unit_price
    source: pos_txn
    controllable_lever: pricing
    owner_role: category_manager
    elasticity_prior: -0.8

materiality:
  # A rate metric, so the rupee floor is the revenue the shortfall represents
  # rather than a movement in the ratio itself.
  min_abs_robust_z: 3.0
  min_abs_delta_inr: 15000
  value_per_unit_inr: 600000.0

freshness_sla:
  pos_txn: 6h
  voice_ops: 2h

access_policy:
  row_filter: "region IN :entitled_regions"
  domain_restriction: [pii]

lineage:
  upstream: [sessions, pos_txn]
  transforms: []
