# Net revenue, the master metric. Movements here cascade from orders and AOV,
# which is what lets a break be traced down the graph rather than guessed at.
kpi_id: net_revenue
version: 1
owner_role: finance_director
unit: INR
definition: >
  Gross merchandise value net of returns and discounts, excluding tax.
  Cancelled orders are excluded; returns are netted in the period of the return,
  not the period of the original order.

calculation:
  canonical_sql: |
    SELECT date_trunc('day', order_ts) AS d,
           region, channel, category, device,
           SUM(qty * unit_price - discount) AS value
    FROM pos_txn
    WHERE status <> 'cancelled'
    GROUP BY 1, 2, 3, 4, 5
  dialect_targets: [duckdb, databricks, snowflake]

grain:
  time: day
  dims: [region, channel, category, device]

calendar: fiscal_in
parents: []
children: [orders, aov]
dimensions: [region, channel, category, device, sku]

drivers:
  - id: unit_price
    source: pos_txn
    controllable_lever: pricing
    owner_role: category_manager
    elasticity_prior: -1.4
  - id: marketing_spend
    source: plan_ops
    controllable_lever: media_budget
    owner_role: marketing_lead
    elasticity_prior: 0.3
  - id: stock_position
    source: plan_ops
    controllable_lever: replenishment
    owner_role: supply_planner
  # A shipped regression is a driver like any other: it moves the metric and
  # somebody owns the lever that reverses it. Without it the demo's headline
  # cause is verifiable but not actionable, which is only half an answer.
  - id: release_quality
    source: voice_ops
    controllable_lever: release_rollback
    owner_role: ecommerce_lead
  # Observable but not actionable, no lever, so no owner.
  - id: competitor_price_index
    source: plan_ops
  - id: severe_weather
    source: ext_signals

materiality:
  min_abs_robust_z: 3.0
  min_abs_delta_inr: 15000
  # The metric is already rupees, so a rupee of movement is a rupee of impact.
  value_per_unit_inr: 1.0

economics:
  # Retail CPG blended gross margin. Indicative and business-owned: the
  # source carries no cost column, so this is declared by finance rather
  # than measured, and the scenario says so where it uses it.
  gross_margin_pct: 0.32

reconciliation:
  # The second system posting the same rupees. Finance nets returns on the date
  # the credit note is raised rather than the date of sale, and posts to the
  # rupee at invoice level, so the two are a couple of per cent apart every
  # ordinary day and that is not a defect. Past three times the tolerance they
  # are not drifting, they are disagreeing.
  #
  # 5% is calibrated on the median region-day, which measures 2.1%. Measured
  # again over the whole warehouse, that is the right floor for North, South and
  # West -- each breaches on under 1% of days -- and the wrong one for East,
  # which breaches on 55.7% and reaches the 15% contradiction threshold on
  # 10.7%. East is the smallest region, so an unchanged absolute posting lag is
  # a larger share of a smaller number, and a tolerance expressed as a share of
  # the figure does not hold that constant. This is recorded rather than quietly
  # retuned: a materiality-style threshold is business-owned, and moving one to
  # make a verdict look better is the failure mode the whole feedback design
  # exists to prevent. The open options are a floor in rupees alongside the
  # percentage, or a per-region tolerance.
  source: finance_ledger
  compare_column: net_revenue_posted
  date_column: business_date
  tolerance_pct: 0.05
  contradiction_multiple: 3.0

freshness_sla:
  pos_txn: 6h
  plan_ops: 72h
  voice_ops: 2h
  ext_signals: 36h

access_policy:
  row_filter: "region IN :entitled_regions"
  column_masks: [unit_margin, customer_email]
  domain_restriction: [pii]

# Derived at registration from an S&OP process description that is
# representative rather than a third party's own: a public repository cannot
# redistribute somebody else's SOP, and the README says so under Limitations.
# What it describes is the standard cycle, and what the standard cycle consumes
# is the point. Note the list: sales history,
# inventory, capacity, financials. No external risk signal. That absence is the
# finding, and it is visible in the industry's own description of its own process.
signals_consumed:
  derived_from: data/docs/sop/sop_demand_planning_v2.md
  coverage: complete
  extracted_at: 2026-08-28T09:14:00Z
  extracted:
    - {signal: historical_sales, span: [429, 525]}
    - {signal: inventory_position, span: [526, 618]}
    - {signal: capacity_metrics, span: [619, 692]}
    - {signal: financial_plan, span: [693, 763]}

# Revenue is a sum of priced units, so the price/volume/mix identity genuinely
# applies and its three legs add back to the movement exactly. The other four
# KPIs leave this unset: a rate has no units to move and no price to change.
decomposition:
  method: pvm
  key: sku
  units: qty
  revenue: qty * unit_price - discount

lineage:
  upstream: [pos_txn.orders, pos_txn.order_items]
  transforms: [dedupe_order_id, tz_normalise, net_returns]
