    [count('untestable'), 'could not be tested yet'], [count('aside'), 'set aside before testing']]
    .filter(([n2]) => n2).map(([n2, t]) => `${n2} ${t}`).join(', ');
  const lede = partial
    ? `${tally || 'Nothing'} shown. Hypotheses tested and rejected are withheld for this reader; the analyst view places them on their bones.`
    : entries.length
    ? `${entries.length} hypothes${entries.length === 1 ? 'is' : 'es'} in the record for this window: ${tally}.`
    : 'The operational record holds no hypothesis for this window on any bone. That is why the answer is unknown, and why the next check is to look further, not to guess.';
  // The analyst's working map. Open for the analyst; one click away for the
  // readers who act on the bridge instead.
  return `<section class="panel" id="fishbone" style="margin-top:20px"><details class="fbd"${S.persona === 'analyst' ? ' open' : ''}>
    <summary><h2>Cause and effect · every hypothesis, tested</h2></summary>
    <p class="chain-lede">${lede}</p>
    <div class="fishwrap"><svg class="fish" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fishbone diagram: ${esc(effect)}. ${esc(entries.map(e => `${e.text}: ${e.state}`).join('; '))}">
      <path class="fb-tail" d="M${x0} ${spine} l-14 -22 M${x0} ${spine} l-14 22"/>
      <line class="fb-spine" x1="${x0}" y1="${spine}" x2="${headX}" y2="${spine}"/>
      ${svgs}
      <path class="fb-head" d="M${headX} ${spine - 58} H ${W - 70} Q ${W - 6} ${spine} ${W - 70} ${spine + 58} H ${headX} Z"/>
      <text class="fb-h1" x="${headX + 14}" y="${spine - 18}">${esc(clip(effect))}</text>
      <text class="fb-h2" x="${headX + 14}" y="${spine + 6}">${esc(amount)}</text>
      <text class="fb-h3" x="${headX + 14}" y="${spine + 28}">${esc({explained: 'Explained', unknown: 'Unknown: not enough', contradicted: 'Data disputed'}[d.verdict] || d.verdict)}</text>
    </svg></div>
    <p class="small muted fishkey"><span class="fb-k verified">✓ Verified</span><span class="fb-k untestable">◌ Could not be tested yet</span><span class="fb-k rejected">✕ Rejected by a test</span><span class="fb-k aside">– Set aside before testing</span></p>
  </details></section>`;
}
function wireFinding(ctx){
  const view = $('#view');
  // Built from what was rendered, so a link never points at a section this
  // verdict does not have (a contradicted finding has no gap and no decisions).
  const first = {explained:'Causes', contradicted:'Why nothing is explained'}[ctx.diag.data.verdict] || 'What we checked';
  const links = [['chain', 'The chain'], ['bridge', 'The bridge'], ['why', first], ['fishbone', 'Fishbone'], ['gap', 'Signal gap'], ['calendar', 'Calendar'], ['decide', 'Decisions'], ['whatif', 'What-if'], ['fair', 'Fair target']]
    .filter(([id]) => document.getElementById(id));
  const nav = $('#onpage');
  if(nav){
    nav.innerHTML = links.length > 1 ? '<span>On this page</span>' + links.map(([id, t]) => `<a href="#${id}" data-jump="${id}">${t}</a>`).join('') : '';
    // Scrolled, not navigated: following a #fragment fires popstate, which the
    // router reads as a new page and re-renders the whole finding.
    nav.querySelectorAll('[data-jump]').forEach(a => a.onclick = e => {
      e.preventDefault(); jumpTo(a.dataset.jump);
      nav.querySelectorAll('a').forEach(x => x.classList.toggle('on', x === a));
    });
  }
  view.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => evidence(ctx, b.dataset.ev));
  view.querySelectorAll('.whychain [data-jump]').forEach(b => b.onclick = () => jumpTo(b.dataset.jump));
  view.querySelectorAll('[data-fb]').forEach(b => b.onclick = () => feedback(ctx, b));
  wireWhatIf(ctx);
  view.querySelectorAll('[data-decide]').forEach(b => b.onclick = () => decideModal(ctx, ...b.dataset.decide.split(':')));
  view.querySelectorAll('[data-teams]').forEach(b => b.onclick = () => teams(ctx, b.dataset.teams));
  view.querySelectorAll('[data-ticket]').forEach(b => b.onclick = () => ticket(ctx, b.dataset.ticket));
  const s = view.querySelector('[data-sign]'); if(s) s.onclick = () => signModal(ctx);
  const x = view.querySelector('#excuse'); if(x) x.onclick = () => excuseModal(ctx);
}
async function feedback(ctx, b){

      ${g.process_document ? `<p class="small muted">The planning process was read from <code>${esc(g.process_document)}</code>. It consumes: ${esc((g.consumed||[]).map(human).join(', '))}.</p>` : ''}`;
  }
  layer(`<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-label="Evidence"><button type="button" class="btn sm x" data-close>Close</button>${html}</aside>`);
  if(what === 'movement') loadRows(ctx);
  $('#layer').querySelectorAll('[data-doc]').forEach(b => b.onclick = async () => {
    const r = await api(`/api/document/${encodeURIComponent(b.dataset.doc)}?` + qs({industry:ctx.f.industry, entitled:ctx.f.entitled}));
    const box = $('#doc'); if(!box) return;
    if(!r.ok){ box.innerHTML = `<p class="err">${esc(detail(r))}</p>`; return; }
    const [a, z] = b.dataset.span.split(',').map(Number), t = r.data.text;
    box.innerHTML = `<blockquote>${esc(t.slice(0,a))}<mark>${esc(t.slice(a,z))}</mark>${esc(t.slice(z))}</blockquote>
      <p class="small muted">${esc(human(r.data.doc_type))} · ${esc(r.data.region)} · ${esc(dt(r.data.ts))}${r.data.injection_flags.length ? ` · contains instruction-like text (${esc(r.data.injection_flags.join(', '))}), read as data` : ''}</p>
      <p class="small" style="color:var(--ok)">${esc(piiLine(r.data.personal_data))}</p>`;
  });
}
/* "pii:phone x1" -> "1 phone number". What was masked, or that the scan ran
   and found nothing: both are results, and saying neither would leave a reader
   unsure the check happened. */
const PII_NAME = {email:'email address', phone:'phone number', card:'card number', 'id-number':'ID number',
  upi:'UPI ID', pan:'PAN', address:'street address'};
function piiLine(pd){
  if(!pd || !pd.scanned_for || !pd.scanned_for.length) return '';
  if(!pd.masked.length) return 'Scanned for personal data: none found.';
  return 'Personal data masked: ' + pd.masked.map(m => { const [, kind, n] = m.match(/^[^:]+:(.+) x(\d+)$/) || [null, m, '1'];
    return `${n} ${PII_NAME[kind] || kind}${n === '1' ? '' : 's'}`; }).join(', ') + '. The model never saw them either.';
}
function spark(s, f){
  if(!s || !s.days || !s.days.length) return '';
  const W = 420, H = 130, P = 8, n = s.days.length;
  const vals = [...s.observed, ...s.expected, ...(s.band_low||[]), ...(s.band_high||[])].filter(v => v !== null && isFinite(v));
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const x = i => P + i * (W - 2*P) / Math.max(1, n - 1), y = v => H - 16 - (v - lo) / (hi - lo || 1) * (H - 30);
  const path = arr => arr.map((v,i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const i0 = s.days.findIndex(d => d >= f.start), i1 = s.days.findLastIndex(d => d <= f.end);
  const band = s.band_low && s.band_high ? `<path class="band" d="${path(s.band_high)}${s.band_low.slice().reverse().map((v,j) => `L${x(n-1-j).toFixed(1)},${y(v).toFixed(1)}`).join('')}Z"/>` : '';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Observed against expected">
    ${i0 >= 0 && i1 >= i0 ? `<rect class="win" x="${x(i0)-3}" y="4" width="${x(i1)-x(i0)+6}" height="${H-20}"/>` : ''}
    ${band}<path class="exp" d="${path(s.expected)}"/><path class="obs" d="${path(s.observed)}"/>
    <text x="${P}" y="${H-3}">${dt(s.days[0])}</text><text x="${W-P}" y="${H-3}" text-anchor="end">${dt(s.days[n-1])}</text></svg>
    <p class="small muted" style="margin:4px 0 10px">Solid: observed. Dashed: expected. Shaded: the normal range, and the window under review.</p>`;
}
function signModal(ctx){

  const overlap = d.movement && d.movement.overlap > 1.05;

/* Hand-off. WhyChain records the decision and executes nothing; the owner is

/* ---------- tick meters ----------
   Discrete, like a level meter: twelve ticks, lit in proportion. Easier to
   compare at a glance than a thin bar, and legible in greyscale print. */
function meter(frac, tone = 'brand', n = 12){
  const on = Math.max(frac > 0 ? 1 : 0, Math.round(Math.min(Math.max(frac, 0), 1) * n));
  return `<span class="meter ${tone === 'brand' ? '' : tone}" role="img" aria-label="${Math.round(Math.min(frac, 1) * 100)} percent">${
    Array.from({length: n}, (_, i) => `<i${i < on ? ' class="on"' : ''}></i>`).join('')}</span>`;
}

/* A cause's share of the whole movement, drawn and said. Sized against the
   largest cause instead, the largest always read full and the meter said
   nothing; against the movement it says how much of it this one accounts for.
   Causes can overlap, so a share is capped at the whole. */
function shareMeter(w, total, tone){
  const t = Math.abs(total || 0);
  if(!t) return '';
  const f = Math.min(1, Math.abs(w || 0) / t);
  return `${meter(f, tone)}<small><b>${Math.round(f * 100)}%</b> of the movement</small>`;
}

/* ---------- what-if analysis ----------
   The engine's scenarios, which the finding page never showed: reverse the
   cause that can be reversed, move the price, let the external pressure run
   on. Every figure is the server's (whychain/actions/simulate.py), computed
   from declared assumptions; the page only asks again with a different price
   or horizon, and says plainly that these are projections, not measurements. */
const WHATIF_TITLE = {rollback:'Reverse the cause', price_move:'Change the price', sustained_external:'If it persists'};
// Revenue and gross profit: up is good. The sign is written as well as
// coloured, so the figure reads the same in greyscale print.
const wiTone = n => !n ? '' : n > 0 ? 'up' : 'down';
function whatIfCard(sc, ctx){
  const d = ctx.whatIf || {};
  if(!sc.available) return `<article class="wi off"><span class="tag">What-if · ${esc(WHATIF_TITLE[sc.scenario_id] || 'Projection')}</span>
      <div class="q">${esc(sc.question)}</div><p class="why">${esc(cap(sc.unavailable_because || 'Not available for this finding'))}.</p></article>`;
  const per = sc.effect_inr_per_day, total = sc.effect_inr_total;
  const of = sc.effect_of === 'gross profit' ? 'gross profit' : 'revenue';
  const ctl = sc.scenario_id === 'price_move'
    ? `<div class="ctl range"><label class="mc" for="wi-price">Price change</label><input id="wi-price" type="range" min="-20" max="20" step="1" value="${Math.round((d.price ?? -0.05) * 100)}">
        <span class="num" id="wi-price-v">${(d.price ?? -0.05) > 0 ? '+' : (d.price ?? -0.05) < 0 ? '−' : ''}${Math.abs(Math.round((d.price ?? -0.05) * 100))}%</span></div>`
    : sc.scenario_id === 'sustained_external'
    ? `<div class="ctl"><span class="mc">For</span><div class="segp" role="group" aria-label="How long">${[7, 14, 30, 60].map(h =>
        `<button type="button" data-horizon="${h}" aria-pressed="${(d.horizon ?? 14) === h}">${h} days</button>`).join('')}</div></div>` : '';
  return `<article class="wi" data-sc="${esc(sc.scenario_id)}"><span class="tag brand">What-if · ${esc(WHATIF_TITLE[sc.scenario_id] || 'Projection')}</span>
    <div class="q">${esc(sc.question.replace(/(\s)-(\d)/g, '$1−$2'))}</div>${ctl}
    ${doneNote(sc, ctx)}
    <div class="fig ${wiTone(per)}"><b>${inr(per, {sign:true})}</b><small>${esc(cap(of))} a day${total !== null && total !== undefined ? `<br><span class="${wiTone(total)}">${inr(total, {sign:true})}</span> over ${sc.horizon_days} days` : ''}</small></div>
    ${(sc.alongside || []).map(a => `<div class="along">Alongside: ${esc(a.name)} <b class="num ${wiTone(a.inr_per_day)}">${inr(a.inr_per_day, {sign:true})}</b> a day</div>`).join('')}
    <details><summary>Assumptions</summary><ul>${(sc.assumptions || []).map(a => `<li><b>${esc(cap(a.name))}:</b> ${esc(a.value)}. <span class="muted">${esc(cap(a.basis))}.</span></li>`).join('')}</ul>
      ${sc.bounded_by ? `<p class="muted" style="margin:6px 0 0">Bounded by ${esc(sc.bounded_by)}.</p>` : ''}</details></article>`;
}
// A reversal the record shows already happened is still worth projecting (it
// is what the rollback should be bringing back), but the card must not read as
// advice to do it now.
function doneNote(sc, ctx){
  const done = (ctx.diag.data.decisions || []).find(c => c.already_actioned && (sc.derived_from || []).includes(c.candidate_id));
  return done && sc.scenario_id === 'rollback'
    ? `<p class="why" style="margin:0"><b>Already done on ${esc(dt(done.already_actioned.on))}.</b> This is what it should be bringing back; watch for it.</p>` : '';
}
function whatIfHtml(ctx){
  const list = (ctx.diag.data.scenarios || []);
  if(!list.length) return '';
  return `<section class="panel" id="whatif" style="margin-top:20px"><h2>What-if analysis · projections, not measurements</h2>
    <p class="chain-lede" style="margin-top:-6px">What would change if the business acted, or if conditions held. Each estimate is computed from the measured effects and the assumptions stated under it; the language model writes none of these numbers.</p>
    <div class="whatif" id="whatif-cards">${list.map(sc => whatIfCard(sc, ctx)).join('')}</div></section>`;
}
function wireWhatIf(ctx){
  const box = document.getElementById('whatif-cards'); if(!box) return;
  ctx.whatIf = ctx.whatIf || {price: -0.05, horizon: 14};
  let timer = null;
  const ask = async () => {
    box.querySelectorAll('.wi').forEach(c => c.classList.add('busy'));
    const r = await api('/api/diagnose?' + qs({...ctx.base, persona:S.persona, backend:'none',
      price_delta: ctx.whatIf.price, horizon_days: ctx.whatIf.horizon}));
    if(!r.ok){ box.querySelectorAll('.wi').forEach(c => c.classList.remove('busy')); toast(detail(r)); return; }
    box.innerHTML = (r.data.scenarios || []).map(sc => whatIfCard(sc, ctx)).join('');
    wireWhatIf(ctx);
  };
  const slider = document.getElementById('wi-price');
  if(slider) slider.oninput = () => {
    ctx.whatIf.price = Number(slider.value) / 100;
    document.getElementById('wi-price-v').textContent = `${slider.value > 0 ? '+' : slider.value < 0 ? '−' : ''}${Math.abs(slider.value)}%`;
    clearTimeout(timer); timer = setTimeout(ask, 280);
  };
  box.querySelectorAll('[data-horizon]').forEach(b => b.onclick = () => { ctx.whatIf.horizon = Number(b.dataset.horizon); ask(); });
}

/* The seat menu: engine status, appearance and switching seat, under the
   reader's own name, where they belong. */
function initSeatMenu(){
  const btn = $('#actor'), menu = $('#seatmenu');
  const set = open => { menu.hidden = !open; btn.setAttribute('aria-expanded', String(open)); };
  btn.onclick = e => { e.stopPropagation(); set(menu.hidden); };
  document.addEventListener('click', e => { if(!menu.hidden && !e.target.closest('.seat')) set(false); });
  addEventListener('keydown', e => { if(e.key === 'Escape' && !menu.hidden) set(false); });
}
