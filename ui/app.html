<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhyChain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* The decision view. The workbench (/workbench) is the analyst's full method
   page; this is the page a finance reader acts from. It is built around one
   question per screen: what needs a decision, and can I sign this one.

   Colour carries meaning and nothing else. Evergreen: verified, and the one
   primary action. Ochre: a figure that opens its evidence. Slate: unknown.
   Red: contradicted or refused. A refusal gets the same visual weight as a
   verified answer, because it is an answer. */
:root{
  --r-sm:3px; --r-md:5px;
  --ground:#f2f4f3; --paper:#ffffff; --raised:#f7f9f8; --sunk:#e8ecea;
  --ink:#131c19; --ink-2:#39453f; --ink-3:#5a6661; --ink-4:#7f8a85;
  --line:#dbe1de; --line-2:#c1cac6;
 
  --accent:#0f5a6b; --accent-ink:#0a4250; --accent-soft:#dbeaee;
  --evidence:#8a5712; --evidence-soft:#f6ebd9;
  --ok:#17644a; --ok-soft:#dcefe5; --unk:#475467; --unk-soft:#e5e9ef;
  --bad:#a3261d; --bad-soft:#f7e0dd; --warn:#855a0b; --warn-soft:#f7ebd0;
  --serif:"IBM Plex Serif",Georgia,serif; --sans:"IBM Plex Sans",-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#0e1312; --paper:#151c1a; --raised:#1a2220; --sunk:#202a27;
  --ink:#e8eeeb; --ink-2:#b8c3be; --ink-3:#8d9994; --ink-4:#6a7571;
  --line:#26302d; --line-2:#36423e;
  --accent:#6cc3d6; --accent-ink:#9adbe8; --accent-soft:#10292f;
  --evidence:#dcaa66; --evidence-soft:#2e2313;
  --ok:#77c9a1; --ok-soft:#132a20; --unk:#aab5c5; --unk-soft:#1f2530;
  --bad:#ee8c83; --bad-soft:#331c19; --warn:#dbb066; --warn-soft:#2e2510;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0e1312; --paper:#151c1a; --raised:#1a2220; --sunk:#202a27;
  --ink:#e8eeeb; --ink-2:#b8c3be; --ink-3:#8d9994; --ink-4:#6a7571;
  --line:#26302d; --line-2:#36423e;
  --accent:#6cc3d6; --accent-ink:#9adbe8; --accent-soft:#10292f;
  --evidence:#dcaa66; --evidence-soft:#2e2313;
  --ok:#77c9a1; --ok-soft:#132a20; --unk:#aab5c5; --unk-soft:#1f2530;
  --bad:#ee8c83; --bad-soft:#331c19; --warn:#dbb066; --warn-soft:#2e2510;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
button,select,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* The masthead, shared with the workbench: the same three destinations, the
   same controls in the same order, on every page. */
.shell{position:sticky;top:0;z-index:20;background:var(--ground);color:var(--ink);
  display:flex;align-items:stretch;gap:12px;padding:0 20px;min-height:54px;flex-wrap:wrap;
  border-bottom:1px solid var(--line-2)}
.shell .brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;
  padding-right:18px;border-right:1px solid var(--line)}
.shell .brand b{font-size:18px;font-weight:600;letter-spacing:-.015em}
.shell .brand span{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.shell nav{display:flex;gap:2px}
.shell nav a{display:flex;align-items:center;color:var(--ink-3);text-decoration:none;font-size:14px;padding:0 10px;border-bottom:2px solid transparent;margin-bottom:-1px}
.shell nav a[aria-current="page"]{color:var(--ink);font-weight:600;border-bottom-color:var(--accent)}
.shell nav a:hover{color:var(--ink)}
.shell .sp{flex:1}
/* Four destinations and four controls: the subtitle and a label give way
   before anything wraps onto a second line. */
@media (max-width:1560px){.shell .brand span{display:none}.shell .brand{padding-right:12px}}
@media (max-width:1320px){.shell .lab{display:none}}
.shell .grp{display:flex;align-items:center;gap:8px}
.shell .lab{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.shell select{background:var(--paper);border:1px solid var(--line-2);color:var(--ink);border-radius:var(--r-sm);padding:3px 8px;font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:var(--r-sm);overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;color:var(--ink-3);font-size:13px;padding:4px 10px;cursor:pointer;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:500}
.themebtn{border:1px solid var(--line-2);background:var(--paper);color:var(--ink-3);border-radius:var(--r-sm);font-size:13px;padding:4px 10px;cursor:pointer;min-width:58px}
.themebtn:hover{color:var(--ink)}
.onpage{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:center;margin:18px 2px 0;font-size:14px}
.onpage span{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.onpage a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
.onpage a:hover{border-bottom-color:var(--accent)}
#why,#gap,#calendar,#decide,#fair{scroll-margin-top:72px}
.viewnote{font-size:14px;color:var(--ink-3);margin:10px 0 0}
.demo-chip{font-family:var(--mono);font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:var(--r-sm);padding:0 5px}

main{max-width:1240px;margin:0 auto;padding:28px 24px 96px}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(23px,2.2vw,29px);line-height:1.3;margin:14px 0 6px;text-wrap:balance;max-width:48ch}
h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;margin:0 0 16px}
.muted{color:var(--ink-3)}
.small{font-size:14.5px;line-height:1.55}

/* Status: an icon and a word in a squared tag. The icon carries the meaning
   as well as the colour, so the state reads for a colour-blind reader and in a
   greyscale print, and nothing here is decoration. */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;line-height:1;
  padding:4px 8px 4px 6px;border-radius:var(--r-sm);white-space:nowrap;border:1px solid transparent}
.pill svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 28%,transparent)}
.pill.unk{background:var(--unk-soft);color:var(--unk);border-color:color-mix(in srgb,var(--unk) 28%,transparent)}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 28%,transparent)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 28%,transparent)}
.pill.idle{background:var(--sunk);color:var(--ink-3);border-color:var(--line-2)}
.pill.big{font-size:14.5px;padding:6px 12px 6px 9px;gap:8px}
.pill.big svg{width:17px;height:17px}
.ev{color:var(--evidence);background:none;border:0;padding:0;border-bottom:1.5px dotted var(--evidence);cursor:pointer}
.ev:hover{background:var(--evidence-soft)}
.ailabel{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:0 6px;margin-left:4px;white-space:nowrap}

/* buttons */
.btn{border:1px solid var(--line-2);background:var(--paper);color:var(--ink);border-radius:var(--r-md);padding:7px 14px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.primary:hover{background:var(--accent-ink)}
.btn.sm{font-size:12.5px;padding:3px 10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* panels */
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:24px 26px}
.stack{display:grid;gap:20px;align-content:start}

/* inbox */
.track{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 22px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:14px 20px;font-size:14.5px;color:var(--ink-2)}
.track b{font-family:var(--mono);color:var(--ink)}
.track .t{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:20px 0 28px}
.summary div{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);padding:18px 20px}
.summary dt{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.summary dd{margin:3px 0 0;font-size:22px;font-weight:600}
.summary dd small{font-size:13px;color:var(--ink-3);font-weight:400}
.bar-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:0}
.trend{display:inline-flex;align-items:center;gap:3px;font-weight:600;white-space:nowrap}
.trend svg{width:14px;height:14px;flex:none;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.trend.good{color:var(--ok)}.trend.bad{color:var(--bad)}.trend.neutral{color:var(--unk)}
.filters{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;padding:12px 0 14px;font-size:14px;color:var(--ink-3)}
.filters label{display:inline-flex;align-items:center;gap:6px}
.filters select{border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--paper);color:var(--ink);padding:3px 6px;font:inherit}
.filters .clear{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;padding:0}
.mlist{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px;align-items:start;margin-top:14px}
.mlist nav{background:var(--paper);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.mlist nav a{display:block;padding:12px 16px;border-bottom:1px solid var(--line);color:var(--ink-2);text-decoration:none}
.mlist nav a[aria-current="true"]{background:var(--accent-soft);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.mlist nav a small{display:block;color:var(--ink-3);font-weight:400;font-size:13px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 0}
.chain code{background:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:3px 8px;font-size:13px}
.chain i{font-style:normal;color:var(--ink-4)}
.kv2{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px 20px;margin:0;font-size:14.5px}
.kv2 dt{color:var(--ink-3)}.kv2 dd{margin:0}
.rowsbox{margin-top:12px}
.rowsbox .tabs{border-bottom:1px solid var(--line);margin:14px 0 12px}
.rowsbox table{width:100%;border-collapse:collapse;font-size:14px}
.rowsbox th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line-2)}
.rowsbox td{padding:6px 10px;border-bottom:1px solid var(--line)}
.rowsbox td.num,.rowsbox th.num{text-align:right}
.rowsbox tr.base td{color:var(--ink-3)}
.rowsbox tr.here td{background:var(--evidence-soft)}
.rowsbox .scroll{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-sm)}
.rowsbox .scroll thead th{position:sticky;top:0;background:var(--paper);z-index:1}
.sqlbox{margin:0;padding:14px 16px;font:13px/1.55 var(--mono);color:var(--ink);background:var(--raised);white-space:pre;overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:var(--r-sm)}
.rowsbox pre{margin:0;padding:14px 16px;font:13px/1.55 var(--mono);color:var(--ink);background:var(--raised);white-space:pre;overflow:auto;max-height:420px;border:1px solid var(--line);border-radius:var(--r-sm)}
.rowsbox .bar2{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:14px}
.tabs{display:flex;gap:20px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 0;color:var(--ink-3);cursor:pointer;font-size:14.5px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
details.scen{position:relative}
details.scen summary{list-style:none;cursor:pointer;font-size:13.5px;color:var(--accent);padding:8px 0}
details.scen summary::-webkit-details-marker{display:none}
details.scen .menu{position:absolute;right:0;top:100%;z-index:10;background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-md);box-shadow:0 8px 28px rgba(0,0,0,.14);padding:6px;width:min(380px,90vw)}
details.scen .menu a{display:block;text-decoration:none;color:var(--ink);padding:7px 10px;border-radius:var(--r-md);font-size:14px}
details.scen .menu a:hover{background:var(--raised)}
details.scen .menu small{display:block;color:var(--ink-3);font-size:12.5px}
.list{background:var(--paper);border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r-md) var(--r-md);overflow:hidden}
.row{display:grid;grid-template-columns:160px minmax(0,1fr) 140px 220px;gap:20px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.row:last-child{border-bottom:0}
.row:hover{background:var(--raised)}
.row .t{font-weight:600}
.row .t{font-size:16px}
.row .s{font-size:14px;line-height:1.5;color:var(--ink-3)}
.row .status{font-size:14.5px;line-height:1.45;color:var(--ink-2)}
.row .status b{font-weight:600;color:var(--ink)}
.row .r{text-align:right}
.empty{padding:28px 16px;color:var(--ink-3);text-align:center}
.audit-row{display:grid;grid-template-columns:170px 190px minmax(0,1fr) 110px;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13.5px;align-items:start}
.audit-row:last-child{border-bottom:0}
.chain{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);font-size:13.5px}

/* finding */
.crumbs{font-size:14px;color:var(--ink-3);display:flex;align-items:center;flex-wrap:wrap;gap:4px}
.back{display:inline-flex;align-items:center;gap:4px;margin-right:12px;padding:5px 11px 5px 7px;font:inherit;font-size:14px;font-weight:600;
  color:var(--ink-2);background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-sm);cursor:pointer}
.back:hover{color:var(--ink);border-color:var(--ink-3)}
.back svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.crumbs a{color:var(--ink-3)}
.head{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:32px;align-items:start}
/* Three by two, aligned: facts in a wrapping row jagged into four and two,
   and the row with the longest caption set the width of the rest. */
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,max-content));column-gap:56px;row-gap:22px;margin-top:24px}
.facts small.cap{display:block;font-size:13px;color:var(--ink-3);font-weight:400;font-family:var(--sans);margin-top:2px}
.facts div{display:grid}
.facts > div > span{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.facts > div{gap:4px;align-content:start}
.facts b{font-size:19px;font-weight:600}
.facts b.lead{font-size:24px}
.actions{display:grid;gap:8px}
.actions{gap:10px;align-content:start}
.actions .who{font-size:13px;line-height:1.4;color:var(--ink-3);margin:-2px 0 6px;padding-bottom:12px;border-bottom:1px solid var(--line)}
.signed-bar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;margin-top:20px;padding:12px 16px;border-radius:var(--r-md);background:var(--ok-soft);color:var(--ok);font-size:14.5px}
.signed-bar.changed{background:var(--warn-soft);color:var(--warn)}
.grid{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:20px;margin-top:20px;align-items:start}
.cause{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:18px 0;border-bottom:1px solid var(--line)}
.cause:first-of-type{padding-top:0}
.cause .d{font-weight:600}
.cause .w{text-align:right;font-size:15px}
.cause .bar{grid-column:1/-1;height:7px;border-radius:var(--r-sm);background:var(--sunk);overflow:hidden}
.cause .bar i{display:block;height:100%;background:var(--accent)}
.cause .meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:14px;color:var(--ink-3)}
.cause .fb{margin-left:auto;display:flex;gap:6px;align-items:center}
.fblab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-4);margin-right:4px}
.note{font-size:14.5px;line-height:1.6;color:var(--ink-2);margin:16px 0 0;max-width:68ch}
.narr{margin:18px 0 0;padding-top:14px;border-top:1px dashed var(--line-2);font-size:15.5px;line-height:1.65}
.narr summary{cursor:pointer;color:var(--ink-2)}
.ruled li{margin:0 0 16px;font-size:15px;line-height:1.55}
.ruled li:last-child{margin-bottom:0}
.ruled li s{color:var(--ink-3)}
.gapline{font-weight:600;margin:0 0 16px}
details.more{margin-top:16px}
details.more summary{cursor:pointer;font-size:14px;color:var(--accent)}
details.more p{margin:10px 0 0}
.dcard{border:1px solid var(--line);border-radius:var(--r-md);padding:16px 18px;background:var(--raised)}
.dcard + .dcard{margin-top:14px}
.dcard .t{font-weight:600}
.dcard .t{font-size:16px}
.dcard .m{font-size:14.5px;line-height:1.55;color:var(--ink-2);margin-top:6px}
.dcard .row2{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.dcard .state{font-size:13px;font-weight:600;color:var(--ok)}
.withheld{font-size:14.5px;color:var(--ink-3);border:1px dashed var(--line-2);border-radius:var(--r-md);padding:14px 18px}
.refusal{max-width:680px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:10px 18px;font-size:15px;line-height:1.5}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
table.t{border-collapse:collapse;width:100%;font-size:14.5px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:6px 8px;border-bottom:1px solid var(--line-2)}
table.t td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.t th.n{text-align:right}
table.t td.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.loading{color:var(--ink-3);padding:30px 0}
.fair-sum{display:grid;grid-template-columns:repeat(3,minmax(0,max-content));column-gap:56px;row-gap:16px;margin:0 0 18px}
.fair-sum > div{display:grid;gap:4px;align-content:start}
.fair-sum span{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.fair-sum b{font-size:19px;font-weight:600}
.fair-sum small.cap{display:block;font-size:13px;color:var(--ink-3)}
.fair-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:18px;align-items:center;padding:14px 0;border-top:1px solid var(--line)}
.fair-amt{font-size:15px;text-align:right}
.cal{width:100%;height:auto;display:block}
.cal .tk{stroke:var(--line);stroke-width:1}
.cal text{font-family:var(--mono);font-size:11px;fill:var(--ink-3)}
.cal .al{font-family:var(--sans);font-size:11px;fill:var(--ink-3)}
.cal .win{fill:var(--evidence-soft)}
.cal .ahead{fill:var(--raised)}
.cal .m.warn{fill:var(--warn)} .cal .m.ok{fill:var(--ok)} .cal .m.unk{fill:var(--unk)}
.cal-list{list-style:none;padding:0;margin:0}
.cal-list li{padding:12px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.5}
.cal-list li:last-child{border-bottom:0}
.callout{border-left:3px solid var(--evidence);background:var(--evidence-soft);padding:14px 18px;border-radius:0 var(--r-md) var(--r-md) 0;font-size:15px;line-height:1.6;margin:8px 0 14px;max-width:80ch}

/* drawer and modal */
.scrim{position:fixed;inset:0;background:rgba(8,14,12,.36);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--paper);border-left:1px solid var(--line-2);z-index:41;padding:28px;overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.12);font-size:15px;line-height:1.6}
.drawer .x{position:absolute;top:14px;right:14px}
.drawer h3{font-family:var(--serif);font-size:19px;margin:0 36px 10px 0}
.drawer blockquote{margin:8px 0;padding:10px 12px;background:var(--evidence-soft);border-radius:var(--r-md);font-size:14px}
.drawer mark{background:transparent;color:var(--evidence);font-weight:600;border-bottom:2px solid var(--evidence)}
.quote{display:block;width:100%;text-align:left;background:var(--raised);border:1px solid var(--line);border-radius:var(--r-md);padding:8px 10px;margin:0 0 8px;cursor:pointer;font-size:14px}
.quote:hover{border-color:var(--evidence)}
.quote .id{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(8,14,12,.45)}
.modal .box{background:var(--paper);border-radius:var(--r-md);border:1px solid var(--line-2);width:min(580px,100%);max-height:90vh;overflow-y:auto;padding:28px 30px;line-height:1.6}
.modal h3{font-family:var(--serif);font-size:21px;margin:0 0 10px}
.modal ul{padding-left:20px;margin:8px 0}
.modal li{margin-bottom:10px;font-size:15px}
.modal textarea{width:100%;min-height:64px;border:1px solid var(--line-2);border-radius:var(--r-md);padding:8px;background:var(--raised)}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.err{color:var(--bad);font-size:14px;margin-top:8px}
.ac{border:1px solid var(--line-2);border-radius:var(--r-md);padding:12px 14px;background:var(--raised)}
.ac .h{font-weight:600}
.spark{width:100%;height:auto;display:block}
.spark .obs{fill:none;stroke:var(--ink);stroke-width:1.6}
.spark .exp{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:4 3}
.spark .band{fill:var(--accent-soft)}
.spark .win{fill:var(--evidence-soft)}
.spark text{font-family:var(--mono);font-size:10px;fill:var(--ink-3)}

@media (max-width:900px){
  .facts{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:28px}
  .head,.grid{grid-template-columns:1fr}
  .row{grid-template-columns:1fr auto}
  .row .hide-s{display:none}
  .audit-row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

<body>
<header class="shell">
  <a class="brand" href="/" data-nav><b>WhyChain</b><span>Diagnostic engine</span></a>
  <nav aria-label="Primary">
    <a href="/" data-nav id="nav-findings">Findings</a>
    <a href="/?tab=audit" data-nav id="nav-audit">Audit trail</a>
    <a href="/?tab=metrics" data-nav id="nav-metrics">Metrics</a>
    <a href="/workbench" id="nav-workbench">Workbench</a>
  </nav>
  <span class="sp"></span>
  <div class="grp"><div class="seg" id="industry" role="group" aria-label="Industry"></div></div>
  <div class="grp"><span class="lab">View as</span>
    <div class="seg" role="group" aria-label="View as">
      <button type="button" data-persona="cfo">Finance director</button>
      <button type="button" data-persona="analyst">Analyst</button>
      <button type="button" data-persona="ops">Area sales</button>
    </div></div>
  <div class="grp"><button type="button" class="themebtn" id="theme" title="Appearance: follows the system, light or dark">Auto</button></div>
  <div class="grp" id="actor"></div>
</header>
<main id="view" aria-live="polite"></main>
<div id="layer"></div>

<script>
'use strict';
/* ---------- state ---------- */
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : v; }catch{ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch{ /* private window */ } },
};
const S = {
  industry: store.get('whychain-industry', 'retail'),
  persona: store.get('whychain-persona', 'cfo'),
  user: store.get('whychain-user', 'finance.director'),
  me: null, industries: [], kpis: {}, track: null,
  verdicts: new Map(), token: 0,
};
const PERSONA_NAME = {cfo:'Finance director', analyst:'Analyst', ops:'Area sales manager'};
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- formatting ---------- */
function inr(n, {sign=false, exact=false}={}){
  if(n === null || n === undefined || !isFinite(n)) return '–';
  const a = Math.abs(n), s = sign ? (n < 0 ? '−' : '+') : '';
  if(!exact && a >= 1e7) return `${s}₹${(a/1e7).toFixed(2)} cr`;
  return `${s}₹${Math.round(a).toLocaleString('en-IN')}`;
}
const pct = (x, d=1) => (x === null || x === undefined || !isFinite(x)) ? '–' : `${(Math.abs(x)*100).toFixed(d)}%`;
/* Direction by the arrow's shape, good or bad by its colour: the IBCS
   convention, and what a metric layer asks a definition to declare. A rise in
   a metric where down is good is a red up-arrow. Within the expected range is
   a flat line in neutral grey, not green: nothing happened. */
const TREND_PATH = {up:'<path d="M12 19V5M6 11l6-6 6 6"/>', down:'<path d="M12 5v14M6 13l6 6 6-6"/>', flat:'<path d="M5 12h14"/>'};
function trend(dir, favourable, text){
  const tone = dir === 'flat' || favourable === 'neutral' ? 'neutral' : (dir === 'up') === (favourable !== 'down') ? 'good' : 'bad';
  const said = {up:'Up', down:'Down', flat:'Within the expected range'}[dir] + (tone === 'neutral' ? '' : tone === 'good' ? ', favourable' : ', unfavourable');
  return `<span class="trend ${tone}" title="${said}"><svg viewBox="0 0 24 24" role="img" aria-label="${said}">${TREND_PATH[dir]}</svg>${text}</span>`;
}
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const when = iso => `${dt(iso)}, ${String(iso).slice(11,16)} UTC`;
function dt(s){ const [y,m,d] = String(s).slice(0,10).split('-').map(Number); return `${d} ${MON[m-1]} ${y}`; }
function span(a, b){
  if(!b || a === b) return dt(a);
  const [ya,ma] = a.split('-'), [yb,mb] = b.split('-');
  const da = Number(a.slice(8,10));
  if(ya === yb && ma === mb) return `${da} to ${dt(b)}`;
  if(ya === yb) return `${da} ${MON[Number(ma)-1]} to ${dt(b)}`;
  return `${dt(a)} to ${dt(b)}`;
}
const human = id => { const s = String(id||'').replace(/_/g,' '); return s.charAt(0).toUpperCase() + s.slice(1); };
const ROLE = {ecommerce_lead:'E-commerce lead', fpa_analyst:'FP&A analyst'};
const roleName = r => ROLE[r] || human(r);
const KPI = {aov:'Average order value', on_time_delivery:'On-time delivery'};
const kpiName = k => KPI[k] || human(k);
const causeText = c => String(c||'').replace(/^[\w.-]+:\s*/, '').replace(/\.$/, '')
  // "Promotion promo-monsoon-sale active in East, South, West"
  .replace(/^Promotion ([\w-]+) active in (.+)$/, (m, id, where) => `The ${id.replace(/^promo-/, '').replace(/-/g, ' ')} promotion, running in ${where}`);
const cap = t => { t = String(t || ''); return t.charAt(0).toUpperCase() + t.slice(1); };
// Engine sentences name things by id. Each id the run knows is replaced with
// the words a reader knows it by, longest first so "rel-4.05" wins over "4.05".
function plain(text, d){
  let t = String(text || '');
  const names = [];
  const short = t => causeText(t).split(/[:;]/)[0].split(' ').slice(0, 5).join(' ');
  (d && d.verified || []).forEach(v => names.push([v.candidate_id, short(v.description)]));
  (d && d.set_aside || []).forEach(v => names.push([v.candidate_id, causeText(v.description || v.candidate_id)]));
  // One pass, whole ids only, any case: the engine capitalises an id that
  // starts its sentence, and a shorter id must never match inside a longer one
  // or inside a name already put in its place.
  if(names.length){
    const byId = new Map(names.map(([id, name]) => [id.toLowerCase(), name]));
    const alt = names.map(([id]) => id).sort((a, b) => b.length - a.length)
      .map(id => id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|');
    t = t.replace(new RegExp(`(?<![\\w.-])(${alt})(?![\\w-]|\\.\\w)`, 'gi'), m => byId.get(m.toLowerCase()) || m);
  }
  return cap(t.replace(/\bfinance_ledger\b/g, 'the finance ledger').replace(/\bchannel (store|app|web)\b/g, 'the $1 channel')
    .replace(/(\d[\d,]*) rupees per day/g, (m, n) => `${inr(Number(n.replace(/,/g, '')))} a day`));
}
const actionText = a => cap(String(a || '')
  .replace(/for channel (\w+), device (\w+)/, 'for the $1 channel on $2 devices')
  .replace(/for device (\w+)/, 'for $1').replace(/for channel (\w+)/, 'for the $1 channel').replace(/_/g, ' '));
const REASON = {'failed placebo': 'Failed the placebo test: no larger than on ordinary weeks',
  'failed difference in differences': 'Failed the comparison with regions it did not touch',
  'failed event time isolation': 'Failed the timing test: the movement began before it did',
  'failed exposure consistency': 'Failed consistency: not every exposed region moved'};
const reasonText = r => REASON[String(r).toLowerCase()] || cap(r);
function confidence(p){
  if(p === null || p === undefined) return '–';
  // Isotonic calibration returns 1.0 in its top bin. Nothing here is certain,
  // so the page never says it is.
  return p >= 0.95 ? 'above 0.95' : p.toFixed(2);
}
const VERDICT = {
  explained:['ok','Verified'], unknown:['unk','Unknown'], contradicted:['bad','Contradicted'],
  cannot_verify:['warn','Cannot verify'], detected:['idle','Detected, not diagnosed'],
  refused:['bad','Outside your access'],
};
const ICON = {
  explained:'<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/>',
  unknown:'<circle cx="12" cy="12" r="9"/><path d="M9.7 9.5a2.4 2.4 0 1 1 3.3 2.2c-.6.3-1 .8-1 1.5v.4"/><path d="M12 16.6v.1"/>',
  contradicted:'<path d="M12 3.8 21 19.5H3z"/><path d="M12 10v4"/><path d="M12 16.9v.1"/>',
  cannot_verify:'<circle cx="12" cy="12" r="9"/><path d="M8 12h8"/>',
  refused:'<rect x="5.5" y="10.5" width="13" height="9.5" rx="1.5"/><path d="M8.5 10.5V8a3.5 3.5 0 0 1 7 0v2.5"/>',
  detected:'<path d="M3 12h4l2.5-6 5 12 2.5-6h4"/>',
  checking:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>',
  signed:'<path d="M4 17.5c3-.2 4.5-3.5 6-7 1 3.5 2.2 5 3.5 5 1.2 0 1.8-1.5 3-1.5 1 0 1.5.8 3.5 1"/><path d="M4 20.5h16"/>',
};
const svg = k => ICON[k] ? `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>` : '';
const pill = (v, big, text) => { const [c,t] = VERDICT[v] || ['idle', human(v)]; return `<span class="pill ${c}${big?' big':''}">${svg(v)}${esc(text || t)}</span>`; };

/* ---------- api ---------- */
async function api(path, opts={}){
  const headers = {'X-WhyChain-User': S.user, ...(opts.body ? {'Content-Type':'application/json'} : {})};
  try{
    const res = await fetch(path, {...opts, headers});
    const data = await res.json().catch(() => null);
    return {ok: res.ok, status: res.status, data};
  }catch(e){ return {ok:false, status:0, data:null}; }
}
const qs = o => new URLSearchParams(Object.entries(o).filter(([,v]) => v !== null && v !== undefined && v !== '')).toString();
const detail = r => { const d = r.data && r.data.detail; return typeof d === 'string' ? d : (d && (d.refused || d.detail)) || `request failed (${r.status})`; };

/* ---------- shell ---------- */
async function shell(){
  const [ind, me, track] = await Promise.all([api('/api/industries'), api('/api/me'), api('/api/trackrecord')]);
  S.industries = (ind.data && ind.data.industries) || [];
  if(!S.industries.some(i => i.id === S.industry)) S.industry = (ind.data && ind.data.default) || 'retail';
  renderIndustry();
  initTheme();
  S.me = me.data; S.track = track.ok ? track.data : null;
  renderActor(); markPersona();
  document.querySelectorAll('[data-persona]').forEach(b => b.onclick = () => {
    S.persona = b.dataset.persona; store.set('whychain-persona', S.persona); markPersona(); route();
  });
}
function renderIndustry(){
  // Short names in the bar, the full one on hover: three industries at full
  // length pushed the reader's own name onto a second line.
  $('#industry').innerHTML = S.industries.map(i => `<button type="button" data-industry="${esc(i.id)}" title="${esc(i.label)}" aria-pressed="${i.id === S.industry}">${esc(i.label.split(' ')[0])}</button>`).join('');
  $('#industry').querySelectorAll('button').forEach(b => b.onclick = () => {
    if(b.dataset.industry === S.industry) return;
    S.industry = b.dataset.industry; store.set('whychain-industry', S.industry); S.verdicts.clear(); renderIndustry(); go('/');
  });
}
// One button that steps Auto, Light, Dark: the same setting the workbench
// offers, in a third of the space.
function initTheme(){
  const order = ['auto', 'light', 'dark'], btn = $('#theme');
  const apply = t => { if(t === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
    btn.textContent = cap(t); btn.setAttribute('aria-label', `Appearance: ${t}`); };
  let cur = store.get('whychain-theme', 'auto'); apply(cur);
  btn.onclick = () => { cur = order[(order.indexOf(cur) + 1) % 3]; store.set('whychain-theme', cur); apply(cur); };
}
// The perspective each seat reads from. Signing in as someone opens their view;
// "View as" can still override it, and the page says when it has been.
const ROLE_VIEW = {finance_director:'cfo', fpa_analyst:'analyst', area_sales_manager:'ops'};
function renderActor(){
  const me = S.me; if(!me) return;
  const who = me.identity;
  if(me.mode === 'demo'){
    $('#actor').innerHTML = `<select id="user" aria-label="Signed in as" title="Signed in as (demo identity: no single sign-on is connected)">${me.demo_users.map(u => `<option value="${esc(u.id)}"${u.id===who.id?' selected':''}>${esc(u.name.replace(' (demo)',''))}</option>`).join('')}</select>
      <span class="demo-chip" title="No single sign-on is connected. Every record made here is marked as a demo identity.">Demo</span>`;
    $('#user').onchange = async e => { S.user = e.target.value; store.set('whychain-user', S.user); S.me = (await api('/api/me')).data;
      const v = ROLE_VIEW[S.me.identity.role]; if(v){ S.persona = v; store.set('whychain-persona', v); markPersona(); }
      renderActor(); route(); };
  }else{
    $('#actor').innerHTML = `<span class="lab">Signed in</span><span>${esc(who.name)}</span><span class="demo-chip" style="color:var(--ok);border-color:var(--ok)">SSO</span>`;
  }
}
function markPersona(){ document.querySelectorAll('[data-persona]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.persona === S.persona))); }
const myRole = () => S.me && S.me.identity ? S.me.identity.role : null;
const myName = () => S.me && S.me.identity ? S.me.identity.name : '';

/* ---------- routing ---------- */
// Marked so Back knows an app page is behind this one. A finding opened from a
// shared link has none, and Back then goes to the inbox rather than off the app.
function go(url){ history.pushState({inapp:true}, '', url); route(); }
function back(fallback){ if(history.state && history.state.inapp) history.back(); else go(fallback); }
const backBtn = fallback => `<button type="button" class="back" data-back="${esc(fallback)}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>Back</button>`;
let routed = location.pathname + location.search;
addEventListener('popstate', () => {
  // A fragment-only change is a scroll within the page, never a new page.
  if(location.pathname + location.search === routed) return;
  route();
});
document.addEventListener('click', e => {
  const b = e.target.closest('[data-back]');
  if(b){ back(b.dataset.back); return; }
  const a = e.target.closest('a[data-nav]');
  if(!a || e.metaKey || e.ctrlKey || e.shiftKey) return;
  e.preventDefault(); go(a.getAttribute('href'));
});
function route(){
  routed = location.pathname + location.search;
  closeLayer();
  const p = new URLSearchParams(location.search);
  const onFinding = location.pathname === '/finding';
  $('#nav-findings').setAttribute('aria-current', !onFinding && !['audit', 'metrics'].includes(p.get('tab')) ? 'page' : 'false');
  $('#nav-audit').setAttribute('aria-current', p.get('tab') === 'audit' ? 'page' : 'false');
  $('#nav-metrics').setAttribute('aria-current', p.get('tab') === 'metrics' ? 'page' : 'false');
  S.token++;
  if(onFinding) finding(p, S.token); else inbox(p, S.token);
}

/* ---------- scenarios: every coordinate read off the warehouse ---------- */
const SCEN = [
  {g:'Explained', t:'Three causes and a trap', d:'West revenue, 13 to 15 Aug. A perfectly correlated promotion is rejected.', q:{kpi:'net_revenue', region:'West', start:'2026-08-13', end:'2026-08-15'}},
  {g:'Explained', t:'Why nobody saw it coming', d:'Same finding, opened at the signal gap.', q:{kpi:'net_revenue', region:'West', start:'2026-08-13', end:'2026-08-15'}, h:'gap'},
  {g:'Explained', t:'One day, asked about the app', d:'The store-only weather cause is set aside as impossible.', q:{kpi:'net_revenue', region:'West', channel:'app', start:'2026-08-12', end:'2026-08-20'}},
  {g:'Refused', t:'Abstains: no cause survives', d:'West, 27 to 28 Jul. Unknown, with the next check named.', q:{kpi:'net_revenue', region:'West', start:'2026-07-27', end:'2026-07-28'}},
  {g:'Refused', t:'Two systems disagree', d:'North, 10 to 12 Jun. Caught before anything is explained.', q:{kpi:'net_revenue', region:'North', start:'2026-06-10', end:'2026-06-12'}},
  {g:'Refused', t:'Detected, not diagnosed', d:'Checkout conversion is a rate; the identity does not apply.', q:{kpi:'checkout_conversion', start:'2026-08-29', end:'2026-08-30'}},
  {g:'Access', t:'Scoped to South', d:'A reader entitled to one region sees only its findings.', q:{kpi:'net_revenue', start:'2026-07-30', end:'2026-08-04', entitled:'South'}},
  {g:'Access', t:'South reader asks about the West', d:'Refused before anything is computed.', q:{kpi:'net_revenue', region:'West', start:'2026-08-13', end:'2026-08-15', entitled:'South'}},
  {g:'Reach', t:'Another industry', d:'Petroleum marketing: two candidates verified, two rejected.', q:{kpi:'net_realisation', start:'2026-08-14', end:'2026-08-15'}, industry:'petroleum'},
];
function scenarioLink(s){ return `/finding?${qs({...s.q, industry: s.industry || 'retail'})}${s.h ? '#'+s.h : ''}`; }
// Published for /uat, which reads them rather than evaluating code: the page's
// content security policy forbids eval, and should.
window.WHYCHAIN_SCENARIOS = SCEN; window.WHYCHAIN_SCENARIO_LINK = scenarioLink;

/* ---------- inbox ---------- */
const keyOf = f => [S.industry, f.kpi_id, f.region||'', f.start, f.end].join('|');
function signedFor(entries, f){
  return entries.find(e => e.event === 'finding_signed' && e.subject.industry === S.industry
    && e.subject.kpi_id === f.kpi_id && (e.subject.region||null) === (f.region||null)
    && e.subject.window && e.subject.window.from === f.start && e.subject.window.to === f.end);
}
/* Filters live in the URL, so a filtered queue can be shared and Back
   restores it. Metric, region and direction are applied by the server, over
   every finding rather than the twelve on screen; status is known only once
   each verdict is read, so it is applied here as they arrive. */
const FILTERS = ['metric', 'region', 'dir', 'status'];
function inboxLink(p, over){
  const cur = Object.fromEntries(['tab', 'entitled', 'days', ...FILTERS].map(k => [k, p.get(k) || '']));
  const next = {...cur, ...over};
  if(next.tab === 'open') next.tab = '';
  if(next.days === '365') next.days = '';
  if(next.dir === 'drop') next.dir = '';
  return '/?' + qs(next);
}
async function inbox(p, token){
  const tab = p.get('tab') || 'open';
  const entitled = p.get('entitled') || '';
  const days = p.get('days') || '365';
  const metric = p.get('metric') || '', region = p.get('region') || '', dirf = p.get('dir') || 'drop', status = p.get('status') || '';
  const view = $('#view');
  if(tab === 'metrics'){ metricsView(p, token); return; }
  view.innerHTML = `${trackStrip()}<div class="loading">Reading the queue…</div>`;
  const [tri, aud] = await Promise.all([
    api('/api/triage?' + qs({industry:S.industry, limit:12, entitled, days: days === 'all' ? '' : days, kpi: metric, region, direction: dirf})),
    api('/api/audit?' + qs({industry:S.industry})),
  ]);
  if(token !== S.token) return;
  const entries = (aud.data && aud.data.entries) || [];
  if(tab === 'audit'){ view.innerHTML = trackStrip() + auditView(aud.data); return; }
  if(!tri.ok){ view.innerHTML = trackStrip() + `<div class="panel refusal"><h1>Outside your access</h1><p>${esc(detail(tri))}</p></div>`; return; }
  const rows = tri.data.findings || [];
  // A total over the flagged days, not a sum of daily rates: these findings
  // sit in different months, and adding their per-day figures reads as a
  // loss running every day right now.
  const falls = rows.filter(f => f.direction !== 'rise');
  const atStake = falls.reduce((a,f) => a + (f.impact_inr_per_day||0) * (f.days||1), 0);
  const flaggedDays = falls.reduce((a,f) => a + (f.days||1), 0);
  const signed = rows.filter(f => signedFor(entries, f));
  const shown = tab === 'signed' ? signed : tab === 'all' ? rows : rows.filter(f => !signedFor(entries, f));
  const scope = tri.data.scope ? ` · scoped to ${esc(tri.data.scope.join(', '))}` : '';
  view.innerHTML = `${trackStrip()}
    <dl class="summary">

async function fillVerdicts(rows, entries, entitled, token, status=''){

    if(token !== S.token) return;
    const k = keyOf(f);
    const sig = signedFor(entries, f);
    let v = S.verdicts.get(k);
    if(!v && f.diagnosable){
      const r = await api('/api/diagnose?' + qs({kpi:f.kpi_id, region:f.region, start:f.start, end:f.end, industry:S.industry, persona:'cfo', backend:'none', entitled}));
      v = r.ok ? r.data.verdict : (r.status === 403 ? 'refused' : 'detected');
      S.verdicts.set(k, v);
    }
    if(token !== S.token) return;
    if(!f.diagnosable) v = 'detected';
    const cell = document.querySelector(`[data-pill="${CSS.escape(k)}"]`);
    if(cell && !sig) cell.innerHTML = pill(v, false, {detected:'Detected', refused:'No access'}[v]);
    const st = document.querySelector(`[data-status="${CSS.escape(k)}"]`);
    if(st) st.innerHTML = ({explained:`<b>Awaiting signature</b><br><span class="s">${esc(roleName(f.owner_role))}</span>`,
      unknown:'Next check named', contradicted:'<b>Data check first</b><br><span class="s">Data engineering</span>',
      refused:'Outside your access', detected:'Detection only'})[v] || '';
    if(v === 'explained' && !sig) awaiting++;
    const row = document.querySelector(`.row[data-key="${CSS.escape(k)}"]`);
    if(row && status){ row.hidden = v !== status; }
    if(!status || v === status) kept++;

  if(token === S.token && status && !kept && $('#rows')) $('#rows').innerHTML = `<div class="empty">No finding here has that status. Try another, or clear the filters.</div>`;
  if(token === S.token && $('#awaiting')) $('#awaiting').innerHTML = `${awaiting}<small> verified, unsigned</small>`;
}

/* ---------- finding ---------- */
async function finding(p, token){
  const f = Object.fromEntries(['kpi','region','channel','device','category','start','end','entitled'].map(k => [k, p.get(k) || '']));
  f.industry = p.get('industry') || S.industry;
  if(f.industry !== S.industry){ S.industry = f.industry; store.set('whychain-industry', S.industry); renderIndustry(); }
  const view = $('#view');
  if(!f.kpi || !f.start || !f.end){ view.innerHTML = `<div class="panel">This link is missing its metric or dates. <a href="/" data-nav>Back to findings</a></div>`; return; }
  view.innerHTML = `<div class="loading">Testing candidate causes…</div>`;
  // Empty fields are dropped, not sent as "". The server reads a present but
  // empty `entitled` as "entitled to nothing", on purpose, so sending the empty
  // value in a POST body refused every sign-off.
  const base = Object.fromEntries(Object.entries({kpi:f.kpi, region:f.region, channel:f.channel, device:f.device, category:f.category, start:f.start, end:f.end, industry:f.industry, entitled:f.entitled}).filter(([,v]) => v));
  const d0 = new Date(f.start); d0.setDate(d0.getDate() - 45);
  const d1 = new Date(f.end); d1.setDate(d1.getDate() + 10);
  const c0 = new Date(f.start); c0.setDate(c0.getDate() - 14);
  const [diag, ser, cand, aud, cal] = await Promise.all([
    api('/api/diagnose?' + qs({...base, persona:S.persona, backend:'none'})),
    api('/api/series?' + qs({kpi:f.kpi, region:f.region, channel:f.channel, device:f.device, category:f.category, industry:f.industry, entitled:f.entitled, from:d0.toISOString().slice(0,10), to:d1.toISOString().slice(0,10)})),
    S.persona === 'analyst' ? api('/api/candidates?' + qs({...base, persona:'analyst', backend:'none'})) : Promise.resolve(null),
    api('/api/audit?' + qs({kpi:f.kpi, region:f.region, industry:f.industry})),
    api('/api/calendar?' + qs({kpi:f.kpi, region:f.region, category:f.category, industry:f.industry, entitled:f.entitled,
      from:c0.toISOString().slice(0,10), to:f.end, ahead:45})),
  ]);
  if(token !== S.token) return;
  // After the diagnosis, because it carries the evidence fingerprint the
  // signature is checked against. A log read, not a second diagnosis.
  const sig = diag.ok ? await api('/api/signoff?' + qs({...base, evidence: diag.data.evidence_fingerprint})) : {ok:false};
  if(token !== S.token) return;
  const worst = worstDay(ser.data, f);
  const ctx = {f, base, diag, ser: ser.data, worst, sig: sig.ok ? sig.data : null, cand: cand && cand.ok ? cand.data : null,
               audit: (aud.data && aud.data.entries) || [], cal: cal.ok ? cal.data : null};
  S.ctx = ctx;
  if(diag.status === 403){ view.innerHTML = refusalView(ctx); return; }
  if(diag.status === 422){
    view.innerHTML = detectedView(ctx);
    view.querySelectorAll('[data-ev]').forEach(b => b.onclick = () => evidence(ctx, b.dataset.ev));
    return;
  }
  if(!diag.ok){ view.innerHTML = `<div class="panel refusal"><h1>Nothing to diagnose here</h1><p>${esc(detail(diag))}</p><p><a href="/" data-nav>Back to findings</a></p></div>`; return; }
  view.innerHTML = findingView(ctx);
  wireFinding(ctx);
  if(location.hash){ const el = document.getElementById(location.hash.slice(1)); if(el) el.scrollIntoView({block:'start'}); }
  refine(ctx, token);
}
/* The workbench opened on this finding: same region, slice and day, and a year
   of series so a finding from months ago is still on the chart. */
const benchLink = (f, worst) => `/kpi/${encodeURIComponent(f.kpi)}?${qs({region:f.region, channel:f.channel,
  category:f.category, device:f.device, range:'365', day:(worst && worst.day) || f.end})}`;
function worstDay(ser, f){
  if(!ser || !ser.anomalies) return null;
  const inWin = ser.anomalies.filter(a => a.day >= f.start && a.day <= f.end);
  if(!inWin.length) return null;
  // The worst fall when the window has one, as the workbench and the queue
  // headline it. A window can hold flagged days in both directions, and the
  // largest absolute move is then a rise the queue never listed.
  const drops = inWin.filter(a => a.delta < 0);
  const pool = drops.length ? drops : inWin;
  return pool.reduce((w,a) => Math.abs(a.delta) > Math.abs(w.delta) ? a : w);
}

/* "pii:phone x1" -> "1 phone number". What was masked, or that the scan ran
   and found nothing: both are results, and saying neither would leave a reader

const PII_NAME = {email:'email address', phone:'phone number', card:'card number', 'id-number':'ID number',
  upi:'UPI ID', pan:'PAN', address:'street address'};
function piiLine(pd){
  if(!pd || !pd.scanned_for || !pd.scanned_for.length) return '';
  if(!pd.masked.length) return 'Scanned for personal data: none found.';
  return 'Personal data masked: ' + pd.masked.map(m => { const [, kind, n] = m.match(/^[^:]+:(.+) x(\d+)$/) || [null, m, '1'];
    return `${n} ${PII_NAME[kind] || kind}${n === '1' ? '' : 's'}`; }).join(', ') + '. The model never saw them either.';
}
function spark(s, f){
  if(!s || !s.days || !s.days.length) return '';
  const W = 420, H = 130, P = 8, n = s.days.length;
  const vals = [...s.observed, ...s.expected, ...(s.band_low||[]), ...(s.band_high||[])].filter(v => v !== null && isFinite(v));
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const x = i => P + i * (W - 2*P) / Math.max(1, n - 1), y = v => H - 16 - (v - lo) / (hi - lo || 1) * (H - 30);
  const path = arr => arr.map((v,i) => `${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const i0 = s.days.findIndex(d => d >= f.start), i1 = s.days.findLastIndex(d => d <= f.end);
  const band = s.band_low && s.band_high ? `<path class="band" d="${path(s.band_high)}${s.band_low.slice().reverse().map((v,j) => `L${x(n-1-j).toFixed(1)},${y(v).toFixed(1)}`).join('')}Z"/>` : '';
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" role="img" aria-label="Observed against expected">
    ${i0 >= 0 && i1 >= i0 ? `<rect class="win" x="${x(i0)-3}" y="4" width="${x(i1)-x(i0)+6}" height="${H-20}"/>` : ''}
    ${band}<path class="exp" d="${path(s.expected)}"/><path class="obs" d="${path(s.observed)}"/>
    <text x="${P}" y="${H-3}">${dt(s.days[0])}</text><text x="${W-P}" y="${H-3}" text-anchor="end">${dt(s.days[n-1])}</text></svg>
    <p class="small muted" style="margin:4px 0 10px">Solid: observed. Dashed: expected. Shaded: the normal range, and the window under review.</p>`;
}

  layer(`<div class="modal" role="dialog" aria-modal="true" aria-label="Excuse conditions"><div class="box">
    <h3>Excuse conditions the team was warned about</h3>
    <ul>${warned.map(f => `<li><b>${esc(causeText(f.cause))}</b>, ${inr(f.amount_inr_per_day, {sign:true})} a day, warned ${Math.round(f.lead_time_hours)} hours ahead.</li>`).join('')}</ul>
    <p class="small">The team would be judged on <b class="num">${inr(ft.all_excused_inr_per_day, {sign:true})}</b> a day instead of <b class="num">${inr(ft.policy_inr_per_day, {sign:true})}</b>. The policy holds a team accountable for preparing for a warned condition, so say why this one is excused.</p>
    <label class="small" for="xnote">Why (required)</label><textarea id="xnote" maxlength="500"></textarea><div class="err" id="xerr"></div>
    <div class="foot"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn primary" id="xgo">Excuse and record</button></div></div></div>`);
  $('#xgo').onclick = async () => {
    if(!$('#xnote').value.trim()){ $('#xerr').textContent = 'Say why: a warned condition is excused only with a reason on the record.'; return; }
    const r = await api('/api/adjustment', {method:'POST', body: JSON.stringify({...ctx.base, excuse: warned.map(f => f.candidate_id), note: $('#xnote').value})});
    if(!r.ok){ $('#xerr').textContent = detail(r); return; }
    closeLayer(); toast('Adjustment recorded in the audit trail.'); route();
  };
}
function decideModal(ctx, actionId, choice){
  const c = (ctx.diag.data.decisions||[]).find(x => x.approval && x.approval.action_id === actionId);
  const verb = {accept:'Accept', modify:'Modify', reject:'Reject'}[choice];
  layer(`<div class="modal" role="dialog" aria-modal="true" aria-label="${verb} decision"><div class="box">
    <h3>${verb}: ${esc(c.action)}</h3>
    <p class="small">Recording this decision does not execute it. The change itself happens in the system that owns it, by the people who own it.</p>
    <label class="small" for="dnote">${choice === 'modify' ? 'What changes (required)' : 'Note for the record (optional)'}</label>
    <textarea id="dnote" maxlength="500"></textarea><div class="err" id="derr"></div>
    <div class="foot"><button type="button" class="btn" data-close>Cancel</button><button type="button" class="btn primary" id="dgo">${verb}</button></div></div></div>`);
  $('#dgo').onclick = async () => {
    const r = await api('/api/decision', {method:'POST', body: JSON.stringify({...ctx.base, action_id: actionId, decision: choice, note: $('#dnote').value})});
    if(!r.ok){ $('#derr').textContent = detail(r); return; }
    closeLayer(); toast(`${{accept:'Accepted', modify:'Modified', reject:'Rejected'}[choice]} and recorded. Nothing was executed.`); route();
  };
}
async function teams(ctx, actionId){
  layer(`<div class="modal" role="dialog" aria-modal="true" aria-label="Send to Teams"><div class="box"><h3>Send to Teams</h3><p class="loading">Building the card…</p></div></div>`);
  const r = await api('/api/dispatch/teams', {method:'POST', body: JSON.stringify({...ctx.base, action_id: actionId})});
  if(!r.ok){ layer(`<div class="modal"><div class="box"><h3>Send to Teams</h3><p class="err">${esc(detail(r))}</p><div class="foot"><button type="button" class="btn" data-close>Close</button></div></div></div>`); return; }
  const card = r.data.card, facts = (card.body.find(b => b.type === 'FactSet')||{}).facts || [];
  layer(`<div class="modal" role="dialog" aria-modal="true" aria-label="Send to Teams"><div class="box">
    <h3>${r.data.sent ? 'Sent to Teams' : 'Not sent: Teams is not connected'}</h3>
    <p class="small">${esc(r.data.detail)} ${r.data.sent ? '' : 'Set WHYCHAIN_TEAMS_WEBHOOK to a Teams incoming webhook and this exact card is posted to the owner’s channel.'}</p>
    <div class="ac"><div class="h">${esc(card.body[0].text)}</div><p style="margin:6px 0">${esc(card.body[1].text)}</p>
      <dl class="kv">${facts.map(x => `<dt>${esc(x.title)}</dt><dd>${esc(x.value)}</dd>`).join('')}</dl>
      <p class="small muted" style="margin:8px 0 0">${esc(card.body[3].text)}</p></div>
    <details style="margin-top:10px"><summary class="small">Adaptive Card JSON</summary><pre style="font-size:11.5px;overflow:auto;max-height:220px">${esc(JSON.stringify(card, null, 2))}</pre></details>
    <div class="foot"><button type="button" class="btn" data-close>Close</button></div></div></div>`);
}

/* ---------- boot ---------- */
shell().then(route);
</script>
