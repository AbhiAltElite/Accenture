<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WhyChain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* Paper and ink. Warmer and a shade deeper than before, so the page has a
     ground rather than being white with grey text on it. */
  --paper:#f6f2ea; --surface:#fffdf8; --raised:#efeae0; --sunk:#e6e0d3;
  --ink:#1c1a15; --ink-2:#57524a; --ink-3:#8b8478;
  --line:#e0d9cb; --line-strong:#c4bcaa;
  --rail:#efeae0;

  /* Two accents, each with one job. Evergreen marks navigation state and the
     verified verdict: it means "this held up". Ochre marks a click that opens
     evidence: it means "there is proof behind this". They were one colour, so
     a clickable sentence and a verified one looked alike, and the reader had
     to learn which green meant which. */
  --accent:#1f5c46; --accent-ink:#123d2e; --accent-soft:#dbe9e1;
  --evidence:#8a5310; --evidence-ink:#6b400c; --evidence-soft:#f7e9d6;
  --down:#9c2b25; --down-soft:#f3e0dd;
  --up:#20674a;
  --flag:#8a5a12; --flag-soft:#f6e9d2;

  /* Sizes are chosen from this scale and nowhere else, so the page has a
     rhythm instead of arbitrary values.
     A 1.18 ratio from a 17px base. Tighter than the 1.2 it replaces, because
     the old top end put the headline at 40px: display sizing for a working
     tool, and the thing that made the page read as a landing page rather than
     an analyst's screen. Reading text and controls go up; the headline comes
     down, so the gap between them narrows from both ends. */
  --t-xs:13px; --t-sm:15px; --t-base:17px; --t-md:20px;
  --t-lg:23.5px; --t-xl:27.5px; --t-2xl:31px; --t-3xl:34px;
  --lh-tight:1.24; --lh-snug:1.45; --lh-normal:1.65;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px;
  --sp-6:32px; --sp-7:48px; --sp-8:64px; --sp-9:96px;

  /* One superfamily across serif, sans and mono. IBM Plex was drawn for a
     technology company's own products, so the three cuts share a skeleton and
     the page reads as one system rather than two fonts chosen separately.
     The serif carries the narrative; the sans carries data and chrome. */
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --rail-w:288px;
  /* Two radii only: controls and small marks, then panels. */
  --r-sm:4px; --r-md:6px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#14130f; --surface:#1b1a15; --raised:#232119; --sunk:#2b2820;
  --ink:#f0ece2; --ink-2:#aca596; --ink-3:#7d7669;
  --line:#2b2820; --line-strong:#443f33;
  --rail:#1b1a15;
  --accent:#7fc4a2; --accent-ink:#a8dcc0; --accent-soft:#1e3229;
  --evidence:#d9a05b; --evidence-ink:#e8bd83; --evidence-soft:#33260f;
  --down:#e08b83; --down-soft:#33211f;
  --up:#7fc4a2;
  --flag:#d8ac63; --flag-soft:#332a17;
}}
:root[data-theme="dark"]{
  --paper:#14130f; --surface:#1b1a15; --raised:#232119; --sunk:#2b2820;
  --ink:#f0ece2; --ink-2:#aca596; --ink-3:#7d7669;
  --line:#2b2820; --line-strong:#443f33;
  --rail:#1b1a15;
  --accent:#7fc4a2; --accent-ink:#a8dcc0; --accent-soft:#1e3229;
  --evidence:#d9a05b; --evidence-ink:#e8bd83; --evidence-soft:#33260f;
  --down:#e08b83; --down-soft:#33211f;
  --up:#7fc4a2;
  --flag:#d8ac63; --flag-soft:#332a17;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);
  font:var(--t-base)/var(--lh-normal) var(--sans);-webkit-font-smoothing:antialiased}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);min-height:100vh}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:none;border-bottom:1px solid var(--line)}
}

/* ---------- rail ---------- */
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--rail);
  border-right:1px solid var(--line);padding:var(--sp-6) var(--sp-5) var(--sp-6)}
.rail .brand{font-family:var(--serif);font-size:var(--t-md);font-weight:600;
  letter-spacing:-.01em;display:block;margin-bottom:var(--sp-1);
  color:var(--ink);text-decoration:none}
.rail .brand:hover{color:var(--accent-ink)}
.rail .tagline{font-size:var(--t-xs);color:var(--ink-3);line-height:var(--lh-snug);
  margin-bottom:var(--sp-7)}
.railgroup{margin-bottom:var(--sp-7)}
.railgroup > h2{font-size:var(--t-xs);font-weight:600;color:var(--ink-3);
  letter-spacing:.07em;margin-bottom:var(--sp-3)}
/* Navigation and controls are sized to be hit and read, not to be compact.
   Density belongs in the tables; the rail is chrome a reader returns to all
   day, and a 28px target set in 14px type is neither comfortable nor obviously
   interactive. Every control here clears a 40px row. */
.navitem{display:block;width:100%;text-align:left;background:none;border:none;
  font:inherit;font-size:var(--t-base);color:var(--ink-2);
  padding:var(--sp-3) var(--sp-3);
  border-radius:var(--r-sm);cursor:pointer;line-height:var(--lh-snug)}
.navitem:hover{background:var(--sunk);color:var(--ink)}
.navitem[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);
  font-weight:500}
.navitem .flag{float:right;font-size:var(--t-sm);color:var(--down);
  font-variant-numeric:tabular-nums}
.navitem.d1{padding-left:var(--sp-5)}
.navitem.d2{padding-left:var(--sp-6)}
.field-row{margin-bottom:var(--sp-5)}
.field-row label{display:block;font-size:var(--t-sm);color:var(--ink-3);
  margin-bottom:var(--sp-2)}
select,button.ctl{font:inherit;font-size:var(--t-base);color:var(--ink);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);
  padding:var(--sp-3) var(--sp-4);width:100%;cursor:pointer;line-height:var(--lh-snug)}
select:hover,button.ctl:hover{border-color:var(--ink-3)}
.seg{display:flex;gap:2px;background:var(--sunk);padding:3px;border-radius:var(--r-sm)}
.seg button{flex:1;font:inherit;font-size:var(--t-sm);border:none;background:none;
  color:var(--ink-2);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);
  box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* ---------- content ---------- */
.content{padding:var(--sp-9) var(--sp-8) var(--sp-9);max-width:860px}
@media (max-width:900px){.content{padding:var(--sp-7) var(--sp-5)}}
.eyebrow{font-size:var(--t-sm);color:var(--ink-3);margin-bottom:var(--sp-4)}
h1{font-family:var(--serif);font-size:var(--t-3xl);line-height:var(--lh-tight);
  font-weight:500;letter-spacing:-.018em;text-wrap:balance;margin-bottom:var(--sp-5)}
.prose{font-family:var(--serif);font-size:var(--t-md);line-height:var(--lh-normal);
  max-width:60ch}
.prose p{margin-bottom:var(--sp-4)}
.prose .q{color:var(--ink-2)}
.prose strong{font-weight:600}

/* A claim is ochre because it opens evidence, not because it is true. The
   underline is the affordance; the chevron says it leads somewhere. Verified
   states stay evergreen, so the two never trade places. */
.claim{color:var(--evidence-ink);background:var(--evidence-soft);border:none;font:inherit;
  padding:2px 6px;border-radius:var(--r-sm);cursor:pointer;
  box-shadow:inset 0 -1.5px 0 var(--evidence)}
.claim:hover{background:var(--evidence);color:var(--surface)}
.claim::after{content:"\2009\203A";opacity:.6}

/* ---------- overview ---------- */
.overview h1{font-size:var(--t-2xl)}
.overview .sub{color:var(--ink-2);font-size:var(--t-base);max-width:58ch;
  margin-bottom:var(--sp-7)}
/* Four columns, and every one of them ends on the same right edge as the thing
   above and below it. The sparkline used to be a fixed 132px inside a 136px
   track, so it sat four pixels left of the flag count beneath it: not enough to
   name, just enough to make the row look untidy. The canvas now fills its
   track, and the numeric tracks are sized for the larger type rather than the
   type they were drawn for. */
.kpi{display:grid;
  grid-template-columns:minmax(0,1fr) minmax(128px,auto) 96px 140px;
  gap:var(--sp-5);
  align-items:center;width:100%;text-align:left;background:none;border:none;
  border-top:1px solid var(--line);padding:var(--sp-5) var(--sp-3);cursor:pointer;
  font:inherit;color:inherit}
.kpi:hover{background:var(--surface)}
.kpi:last-of-type{border-bottom:1px solid var(--line)}
.kpi .name{font-size:var(--t-md);font-weight:500;font-family:var(--serif);
  line-height:var(--lh-snug)}
.kpi .meta{font-size:var(--t-xs);color:var(--ink-3);margin-top:var(--sp-1);display:block}
.kpi .val{text-align:right;font-variant-numeric:tabular-nums;font-size:var(--t-md);
  line-height:var(--lh-snug);white-space:nowrap}
.kpi .chg{text-align:right;font-variant-numeric:tabular-nums;font-size:var(--t-sm);
  line-height:var(--lh-snug);white-space:nowrap}
.kpi canvas{width:100%;height:38px;display:block}
.kpi.d1{padding-left:var(--sp-6)}
.kpi.d2{padding-left:var(--sp-8)}
.kpi.d1 .name::before,.kpi.d2 .name::before{content:"\21B3";color:var(--ink-3);
  margin-right:var(--sp-2);font-family:var(--sans);font-size:var(--t-sm)}
.flagcount{font-size:var(--t-xs);color:var(--ink-3);text-align:right;display:block;
  margin-top:var(--sp-1)}
.flagcount b{color:var(--down);font-weight:600}
@media (max-width:760px){
  .kpi{grid-template-columns:1fr auto;gap:var(--sp-3)}
  .kpi canvas,.kpi .chg{display:none}
}

/* ---------- chart ---------- */
.strip{position:relative;margin-bottom:var(--sp-3);border:1px solid var(--line);
  border-radius:var(--r-md);background:var(--surface);padding:var(--sp-4) var(--sp-4) var(--sp-3)}
.charthead{display:flex;align-items:baseline;gap:var(--sp-4);margin-bottom:var(--sp-3);
  flex-wrap:wrap}
.charthead h2{font-size:var(--t-sm);font-weight:500;color:var(--ink-3);margin:0}
.charthead .zoomnote{margin-left:auto;font-size:var(--t-xs);color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.charthead button{font-size:var(--t-xs);padding:2px var(--sp-2);width:auto}
canvas#c{display:block;width:100%;height:210px;cursor:crosshair;touch-action:pan-y}
canvas#c.panning{cursor:grabbing}
.striplegend{display:flex;gap:var(--sp-4);font-size:var(--t-xs);color:var(--ink-3);
  margin-top:var(--sp-3);flex-wrap:wrap}
.striplegend i{display:inline-block;width:14px;height:2px;background:currentColor;
  margin-right:var(--sp-1);vertical-align:middle}
.scrubber{height:8px;margin-top:var(--sp-2);background:var(--sunk);border-radius:var(--r-sm);
  position:relative;cursor:grab}
.scrubber.on{cursor:grabbing}
.scrubwin{position:absolute;top:0;bottom:0;background:var(--accent);opacity:.35;
  border-radius:var(--r-sm);min-width:12px}
.tip{position:absolute;pointer-events:none;background:var(--surface);
  border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:var(--sp-2) var(--sp-3);
  font-size:var(--t-sm);line-height:var(--lh-snug);box-shadow:0 4px 14px rgba(0,0,0,.12);
  white-space:nowrap;opacity:0;transition:opacity .08s;z-index:5}
.tip.on{opacity:1}
.tip b{font-variant-numeric:tabular-nums}

/* ---------- disclosure ---------- */
details{border-top:1px solid var(--line)}
details summary{cursor:pointer;list-style:none;padding:var(--sp-4) 0;display:flex;
  align-items:baseline;gap:var(--sp-3);color:var(--ink-2);font-size:var(--t-base)}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"+";color:var(--ink-3);font-family:var(--mono);
  width:14px;flex:none}
details[open] summary::before{content:"\2212"}
details summary:hover{color:var(--ink)}
details summary .count{margin-left:auto;color:var(--ink-3);font-size:var(--t-sm);
  font-variant-numeric:tabular-nums}
.body{padding:0 0 var(--sp-6) var(--sp-5)}
.body p{max-width:60ch;color:var(--ink-2);margin-bottom:var(--sp-3)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
th{text-align:left;font-weight:500;font-size:var(--t-xs);color:var(--ink-3);
  padding:0 var(--sp-4) var(--sp-2) 0;border-bottom:1px solid var(--line-strong)}
td{padding:var(--sp-3) var(--sp-4) var(--sp-3) 0;border-bottom:1px solid var(--line);
  font-variant-numeric:tabular-nums;vertical-align:top}
th.n,td.n{text-align:right;padding-right:0}
tr:last-child td{border-bottom:none}
.down{color:var(--down)}.up{color:var(--up)}
.scroll{overflow-x:auto}
code{font-family:var(--mono);font-size:var(--t-xs)}
.pill{display:inline-block;font-size:var(--t-xs);padding:2px var(--sp-2);
  border-radius:var(--r-sm);border:1px solid var(--line-strong);color:var(--ink-2);
  background:var(--surface)}
.pill.ok{border-color:var(--up);color:var(--up);background:var(--accent-soft)}
.pill.no{border-color:var(--down);color:var(--down);background:var(--down-soft)}
.pill.na{border-color:var(--flag);color:var(--flag);background:var(--flag-soft)}
.linkback{background:none;border:none;color:var(--accent-ink);font:inherit;
  font-size:var(--t-sm);padding:0;cursor:pointer;text-decoration:underline;
  text-underline-offset:3px;width:auto}
.linkback:hover{color:var(--ink)}
.muted{color:var(--ink-3);font-size:var(--t-sm)}

/* ---------- decision ---------- */
/* One of the few places a card earns its border: a decision is a real
   conceptual boundary, and there is one per verified cause. */
.decision{border:1px solid var(--line-strong);border-radius:var(--r-md);
  background:var(--surface);padding:var(--sp-5);margin-bottom:var(--sp-4)}
.decision:last-child{margin-bottom:0}
.decision h3{font-family:var(--serif);font-size:var(--t-md);font-weight:500;
  line-height:var(--lh-snug);margin-bottom:var(--sp-2)}
.decision h4{font-size:var(--t-xs);font-weight:600;color:var(--ink-3);
  letter-spacing:.06em;margin-bottom:var(--sp-2)}
.verdictline{font-size:var(--t-sm);color:var(--ink-2);margin-bottom:var(--sp-4)}
.verdictline .mark{font-weight:600;margin-right:var(--sp-1)}
.verdictline .mark.ok{color:var(--up)}
.verdictline .mark.na{color:var(--ink-3)}
/* Label column fixed so every value starts on the same edge down the card. */
table.chain{width:100%;border-collapse:collapse;font-size:var(--t-sm);
  table-layout:fixed}
table.chain th[scope="row"]{width:11.5rem;text-align:left;font-weight:400;
  color:var(--ink-3);font-size:var(--t-sm);letter-spacing:0;
  padding:var(--sp-2) var(--sp-4) var(--sp-2) 0;border:none;vertical-align:top}
table.chain td{padding:var(--sp-2) 0;border:none;vertical-align:top;
  color:var(--ink);overflow-wrap:anywhere}
table.chain td .q{color:var(--ink-2)}
.na{color:var(--ink-3)}
.monitor{margin-top:var(--sp-5);padding-top:var(--sp-4);
  border-top:1px solid var(--line)}
.caveats{margin:var(--sp-3) 0 0;padding-left:var(--sp-5);font-size:var(--t-sm);
  color:var(--ink-2)}
.caveats li{margin-bottom:var(--sp-1)}
.approval{margin-top:var(--sp-5);padding-top:var(--sp-4);
  border-top:1px solid var(--line);font-size:var(--t-sm)}
.approval p{margin-bottom:var(--sp-2)}
.approval .q{color:var(--ink-2)}
.tag{display:inline-block;font-size:var(--t-xs);padding:2px var(--sp-2);
  border-radius:var(--r-sm);background:var(--flag-soft);color:var(--flag);
  border:1px solid var(--flag);margin-right:var(--sp-2)}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- drawer ---------- */
.scrim{position:fixed;inset:0;background:rgba(20,18,14,.34);opacity:0;
  pointer-events:none;transition:opacity .14s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,94vw);z-index:21;
  background:var(--surface);border-left:1px solid var(--line-strong);
  transform:translateX(100%);transition:transform .18s ease-out;
  overflow-y:auto;padding:var(--sp-6) var(--sp-6) var(--sp-9)}
.drawer.on{transform:none}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{transition:none}}
.drawer h3{font-family:var(--serif);font-size:var(--t-lg);font-weight:500;
  line-height:var(--lh-snug);margin-bottom:var(--sp-1)}
.drawer .close{position:absolute;top:var(--sp-4);right:var(--sp-5);border:none;
  background:none;font-size:var(--t-lg);color:var(--ink-3);padding:var(--sp-1) var(--sp-2);
  width:auto;cursor:pointer}
.field{margin:var(--sp-5) 0}
.field dt{font-size:var(--t-xs);color:var(--ink-3);margin-bottom:var(--sp-1)}
.field dd{font-size:var(--t-base)}
.quote{font-family:var(--serif);font-size:var(--t-base);line-height:var(--lh-snug);
  color:var(--ink);border-left:2px solid var(--accent);padding:var(--sp-1) 0
  var(--sp-1) var(--sp-3);margin:var(--sp-3) 0}
.quote cite{display:block;font-family:var(--mono);font-size:var(--t-xs);
  color:var(--ink-3);font-style:normal;margin-top:var(--sp-1)}
pre{background:var(--sunk);border-radius:var(--r-sm);padding:var(--sp-3) var(--sp-4);
  overflow-x:auto;font-family:var(--mono);font-size:var(--t-xs);
  line-height:var(--lh-snug);color:var(--ink-2)}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Metrics and filters">
    <a class="brand" href="/">WhyChain</a>
    <p class="tagline">Why a business number moved, with the proof attached.</p>

    <div class="railgroup">
      <h2>Metrics</h2>
      <div id="nav"></div>
    </div>

    <div class="railgroup">
      <h2>Filters</h2>
      <div class="field-row">
        <label for="region">Region</label>
        <select id="region"><option value="">All regions</option></select>
      </div>
      <div class="field-row">
        <label for="range">Period</label>
        <select id="range">
          <option value="90">Last 90 days</option>
          <option value="180">Last 180 days</option>
          <option value="365">Last year</option>
          <option value="0">Full history</option>
        </select>
      </div>
    </div>

    <div class="railgroup">
      <h2>Appearance</h2>
      <div class="seg" id="theme" role="group" aria-label="Appearance">
        <button data-theme="auto" aria-pressed="true">Auto</button>
        <button data-theme="light" aria-pressed="false">Light</button>
        <button data-theme="dark" aria-pressed="false">Dark</button>
      </div>
    </div>
  </nav>

  <main class="content" id="main" aria-busy="true">
    <div id="overview"></div>
    <div id="diagnosis" hidden>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="headline"></h1>
      <div class="prose" id="story"></div>
      <div id="rest"></div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" hidden>
  <button class="close" id="dclose" aria-label="Close">&times;</button>
  <div id="dbody"></div>
</aside>

<script>
const $ = s => document.querySelector(s);
const inr = n => '₹' + Math.round(Math.abs(n)).toLocaleString('en-IN');
const ACRONYM = {aov:'AOV', kpi:'KPI', sla:'SLA'};
const cap = t => t.charAt(0).toUpperCase() + t.slice(1);
const title = id => {
  const k = id.replace(/_/g,' ');
  return ACRONYM[id] || k.split(' ').map(w=>ACRONYM[w]||w).join(' ').replace(/^./,c=>c.toUpperCase());
};
const pct = n => (n*100).toFixed(1) + '%';
let STATE = {};

/* ---------- appearance ---------- */
const THEMES=['auto','light','dark'];
function applyTheme(t){
  if(t==='auto') document.documentElement.removeAttribute('data-theme');
  else document.documentElement.setAttribute('data-theme',t);
  document.querySelectorAll('#theme button').forEach(b=>
    b.setAttribute('aria-pressed', String(b.dataset.theme===t)));
  if(STATE.series) drawChart();
  if(STATE.overview) drawSparks();
}
function initTheme(){
  let saved='auto';
  try{ saved = localStorage.getItem('whychain-theme') || 'auto'; }catch{ /* private mode */ }
  applyTheme(THEMES.includes(saved)?saved:'auto');
  $('#theme').addEventListener('click',e=>{
    const b=e.target.closest('button[data-theme]'); if(!b) return;
    try{ localStorage.setItem('whychain-theme',b.dataset.theme); }catch{ /* ignore */ }
    applyTheme(b.dataset.theme);
  });
}

/* ---------- data ---------- */
async function boot(){
  initTheme();
  STATE.kpis = await (await fetch('/api/kpis')).json();

/* Real URLs, so a diagnosis can be sent to someone rather than described. */
function go(path, replace=false){
  history[replace?'replaceState':'pushState']({}, '', path + location.search);
  route();
}

function route(){
  const match = location.pathname.match(/^\/kpi\/([\w-]+)$/);
  if(match && STATE.kpis.some(k=>k.kpi_id===match[1])){
    STATE.kpi = match[1];
    load();
  } else {
    STATE.kpi = null;
    showOverview();
  }
}

/* ---------- overview ---------- */
function renderNav(){
  const data = STATE.overview;
  if(!data){ $('#nav').innerHTML=''; return; }
  const byId = Object.fromEntries(data.kpis.map(k=>[k.kpi_id,k]));
  const rows=[]; const walk=(id,depth)=>{ const k=byId[id]; if(!k) return;
    rows.push({k,depth}); k.children.forEach(c=>walk(c,depth+1)); };
  data.roots.forEach(r=>walk(r,0));
  $('#nav').innerHTML = rows.map(({k,depth})=>`
    <button class="navitem d${depth}" data-kpi="${k.kpi_id}"
      aria-current="${STATE.kpi===k.kpi_id}">${title(k.kpi_id)}
      ${k.material_drops?`<span class="flag">${k.material_drops}</span>`:''}</button>`).join('');
  $('#nav').querySelectorAll('[data-kpi]').forEach(b=>
    b.addEventListener('click',()=>go('/kpi/'+b.dataset.kpi)));
}

async function showOverview(){

  const byId = Object.fromEntries(data.kpis.map(k=>[k.kpi_id,k]));
  const rows=[];
  const walk=(id,depth)=>{
    const k=byId[id]; if(!k) return;
    rows.push({k,depth});
    k.children.forEach(c=>walk(c,depth+1));
  };
  data.roots.forEach(r=>walk(r,0));

  const fmt=(k,v)=> k.unit==='ratio' ? (v*100).toFixed(1)+'%'
    : k.unit==='count' ? Math.round(v).toLocaleString('en-IN')
    : inr(v);
  $('#overview').innerHTML = `<div class="overview">
    <h1>${region||'All regions'}</h1>
    <p class="sub">Five connected metrics. Revenue is orders times average order
      value; orders come from sessions and conversion. A break in one shows up in
      the others, which is why they are read together rather than one at a time.</p>
    ${rows.map(({k,depth})=>`
      <button class="kpi d${depth}" data-kpi="${k.kpi_id}">
        <span><span class="name">${title(k.kpi_id)}</span>
          <span class="meta">${k.owner_role.replace(/_/g,' ')} · ${k.grain.split(' by ')[0]}</span></span>
        <span class="val">${fmt(k,k.latest)}
          <span class="meta" style="display:block">latest</span></span>
        <span class="chg ${k.period_change<0?'down':'up'}">${
          k.period_change==null?'':(k.period_change>0?'+':'')+pct(k.period_change)}
          <span class="meta" style="display:block;color:var(--ink-3)">7 days</span></span>
        <span><canvas class="spark" data-kpi="${k.kpi_id}"></canvas>
          <span class="flagcount">${k.material_drops
            ? `<b>${k.material_drops}</b> flagged` : 'nothing flagged'}</span></span>
      </button>`).join('')}
    <p class="sub" style="margin-top:28px;font-size:14.5px">Select a metric to see
      what moved it.</p></div>`;

  document.querySelectorAll('.kpi').forEach(b=>
    b.addEventListener('click',()=>go('/kpi/'+b.dataset.kpi)));
  drawSparks();
  $('#main').setAttribute('aria-busy','false');

function drawSparks(){
  if(!STATE.overview) return;
  const css=getComputedStyle(document.documentElement), col=n=>css.getPropertyValue(n).trim();
  const byId=Object.fromEntries(STATE.overview.kpis.map(k=>[k.kpi_id,k]));
  document.querySelectorAll('canvas.spark').forEach(c=>{
    const k=byId[c.dataset.kpi]; if(!k||!k.spark.length) return;
    // Measure the box rather than assuming it. The width was hardcoded to 120
    // while the CSS track was wider, so every sparkline was drawn small and
    // then stretched to fit, which is why they read slightly soft.
    const dpr=devicePixelRatio||1, w=c.clientWidth||132, h=38;
    c.width=w*dpr; c.height=h*dpr;
    const x=c.getContext('2d'); x.scale(dpr,dpr); x.clearRect(0,0,w,h);
    const all=[...k.spark,...k.spark_expected];
    let lo=Math.min(...all), hi=Math.max(...all); if(hi===lo) hi=lo+1;
    const X=i=>(i/(k.spark.length-1))*(w-2)+1, Y=v=>h-2-((v-lo)/(hi-lo))*(h-4);
    x.strokeStyle=col('--ink-3'); x.lineWidth=1; x.setLineDash([2,2]); x.beginPath();
    k.spark_expected.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v))); x.stroke();
    x.setLineDash([]);
    x.strokeStyle=col(k.material_drops?'--down':'--ink'); x.lineWidth=1.3; x.beginPath();
    k.spark.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v))); x.stroke();
  });
}

function windowFor(drops){
  const sorted=drops.slice().sort((a,b)=>a.day<b.day?-1:1);
  const worst=sorted.reduce((m,a)=>a.delta<m.delta?a:m,sorted[0]);
  const gap=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5);
  let lo=sorted.findIndex(a=>a.day===worst.day), hi=lo;
  while(lo>0 && gap(sorted[lo-1].day,sorted[lo].day)<=2) lo--;
  while(hi<sorted.length-1 && gap(sorted[hi].day,sorted[hi+1].day)<=2) hi++;
  return {start:sorted[lo].day, end:sorted[hi].day, worst};
}

/* Everything is fetched before anything is drawn. Painting the chart and then
   filling in a block above it makes the page jump under the reader's cursor. */
async function load(){
  $('#main').setAttribute('aria-busy','true');
  $('#eyebrow').textContent='Loading'; $('#headline').textContent='';
  $('#story').innerHTML=''; $('#rest').innerHTML='';

  $('#diagnosis').hidden = false;
  $('#overview').hidden = true;
  if(!STATE.overview){
    const oq=new URLSearchParams(); if($('#region').value) oq.set('region',$('#region').value);
    STATE.overview = await (await fetch('/api/overview?'+oq)).json();
  }
  renderNav();
  const kpi=STATE.kpi, region=$('#region').value, days=+$('#range').value;
  const q=new URLSearchParams({kpi}); if(region) q.set('region',region);
  if(days){ const to=new Date('2026-08-31'); const from=new Date(to);
    from.setDate(to.getDate()-days);
    q.set('from',from.toISOString().slice(0,10)); q.set('to',to.toISOString().slice(0,10)); }

  const seriesRes = await fetch('/api/series?'+q);
  if(!seriesRes.ok){ $('#eyebrow').textContent=''; $('#headline').textContent='No data for that slice'; return; }
  const series = await seriesRes.json();
  const drops = series.anomalies.filter(a=>a.direction==='drop');

  let diagnosis=null, decomposition=null, candidates=null, win=null;
  if(drops.length){
    win = windowFor(drops);
    const p=new URLSearchParams({kpi,start:win.start,end:win.end});
    if(region) p.set('region',region);
    const [d,dec,cand] = await Promise.all([
      fetch('/api/diagnose?'+p).then(r=>r.ok?r.json():null),
      fetch('/api/decomposition?'+p).then(r=>r.ok?r.json():null),
      fetch('/api/candidates?'+p).then(r=>r.ok?r.json():null),
    ]);
    diagnosis=d; decomposition=dec; candidates=cand;
  }
  // A new series means the previous zoom no longer refers to anything.
  VIEW = openingView(series);
  STATE = {...STATE, series, drops, win, diagnosis, decomposition, candidates, region, kpi};
  render();
  $('#main').setAttribute('aria-busy','false');
}

/* How much of the series to show before the reader touches anything.

   At a daily grain ninety points is a readable chart. At an hourly one the same
   ninety days is one thousand seven hundred, and drawing all of them in eight
   hundred pixels gives two points per pixel: a solid band of ink that hides the
   very thing the chart exists to show. So an hourly series opens on its last
   fortnight and the scrubber reaches the rest. Nothing is removed, only the
   opening view is chosen. */
const READABLE_POINTS = 400;

function openingView(series){
  const n = series.days.length;
  if(n <= READABLE_POINTS) return null;          // the whole span is legible
  // Prefer ending on the anomaly if there is one, so the opening view contains
  // the thing worth looking at rather than merely the most recent days.
  const flagged = series.anomalies && series.anomalies.length
    ? series.days.indexOf(series.anomalies.at(-1).day) : -1;
  const hi = flagged >= 0
    ? Math.min(n - 1, flagged + Math.floor(READABLE_POINTS * 0.35))
    : n - 1;
  return {lo: Math.max(0, hi - READABLE_POINTS + 1), hi};
}

/* ---------- the finding, written out ---------- */
function render(){
  const {series,drops,win,diagnosis,kpi,region} = STATE;
  const name = kpi.replace(/_/g,' ');
  const where = region || 'all regions';

  $('#eyebrow').textContent =
    `${title(kpi)} · ${where} · ${series.days[0]} to ${series.days.at(-1)}`;

  if(!drops.length){
    const grain = (series.grain || 'day') + (series.days.length === 1 ? '' : 's');
    $('#headline').textContent = `Nothing moved enough to explain`;
    $('#story').innerHTML = `<p>Across ${series.days.length.toLocaleString()}
      ${grain}, no movement in ${name} passed both the statistical and the
      financial test. Ordinary variation, weekly rhythm and the retail calendar
      account for what happened.</p>`;
    $('#rest').innerHTML = section('The metric', chartMarkup(), true) + freshnessBlock();
    drawChart(); bindChart(); return;
  }

  const w = win.worst;
  $('#headline').textContent =
    `${title(kpi)} fell ${pct(Math.abs(w.pct))} in ${where} on ${w.day}`;

  if(!diagnosis || diagnosis.verdict === 'unknown'){
    $('#story').innerHTML = unknownStory(diagnosis);
  } else {
    $('#story').innerHTML = explainedStory(diagnosis);
  }

  // Order is the reading order the product argues for: what to do, then the
  // working behind it, then what it cost to produce.
  $('#rest').innerHTML =
    decisionsBlock()
    + section('The metric', chartMarkup(), true)
    + movementsBlock()
    + decompositionBlock()
    + candidatesBlock()
    + freshnessBlock()
    + receiptBlock();
  drawChart();
  bindChart();
  wireClaims();
}

function explainedStory(d){
  const m = d.movement, causes = d.verified;
  const names = causes.map(c => `<button class="claim" data-cause="${c.candidate_id}">${plain(c)}</button>`);
  const list = names.length === 1 ? names[0]
    : names.slice(0,-1).join(', ') + ' and ' + names.at(-1);
  const docs = causes.reduce((n,c)=>n+c.supporting_documents,0);

  return `
    <p>Revenue fell <strong>${inr(m.total_change)}</strong> per day against the
    fortnight before. ${causes.length === 1 ? 'One cause accounts' : `${causes.length} causes account`}
    for ${inr(m.explained)} of that: ${list}.</p>
    <p class="q">Each survived event-time isolation, a comparison against regions
    where it did not occur, and a placebo run over six quiet windows.
    ${docs} customer ${docs===1?'ticket describes':'tickets describe'} what happened, in the
    company's own words. Confidence is
    <button class="claim" data-panel="confidence">${d.confidence.band}, scoring ${d.confidence.score}</button>.</p>`;
}

function unknownStory(d){
  if(!d) return `<p>The movement is real, but the diagnosis could not be built.</p>`;
  const a = d.abstention, m = d.movement;
  return `
    <p>Revenue fell <strong>${inr(m.total_change)}</strong> per day, and
    <strong>nothing in the record survives testing as an explanation</strong>.
    This is reported as unknown rather than as the closest available guess.</p>
    <p class="q">${a.ruled_out.length} candidate${a.ruled_out.length===1?' was':'s were'}
    considered and <button class="claim" data-panel="ruledout">ruled out</button>.
    ${a.blocking.length ? a.blocking.join('; ') + '. ' : ''}
    The next thing worth checking: ${a.next_check}.</p>
    ${a.question ? `<p class="q"><strong>Clarification would help.</strong> ${a.question}</p>` : ''}`;
}

function plain(c){
  const said = (c.description||c.candidate_id).split(':').pop().trim().replace(/\.$/,'');
  // Only add scope the description does not already carry, or the label reads
  // "broke checkout on the Android app the app on mobile".
  const lower = said.toLowerCase();
  const bits = Object.values(c.scope)
    .map(v=>String(v).replace(/_/g,' '))
    .filter(v=>!lower.includes(v));
  return bits.length ? `${said} (${bits.join(', ')})` : said;
}

/* ---------- disclosure sections ---------- */
function section(title, body, open=false, count=''){
  return `<details ${open?'open':''}><summary>${title}
    ${count?`<span class="count">${count}</span>`:''}</summary>
    <div class="body">${body}</div></details>`;
}

/* The decision the diagnosis implies. Sits directly under the narrative and
   above the working, because a reader who stops after two panels should still
   leave knowing what to do and who does it. Every field is derived; the card
   says which are assumptions and refuses to show a recovery figure where the
   cause has no lever. */
function decisionsBlock(){
  const cards = (STATE.diagnosis && STATE.diagnosis.decisions) || [];
  if(!cards.length) return '';

  const rows = cards.map(c => {
    const money = c.expected_recovery_inr_per_day == null
      ? `<span class="na">not applicable</span>`
      : `<b>${inr(c.expected_recovery_inr_per_day)}</b> per day`;

    const chain = [
      ['Driver', c.driver ? c.driver.replace(/_/g,' ') : '<span class="na">none matched</span>'],
      ['Lever', c.lever ? c.lever.replace(/_/g,' ')
        : '<span class="na">none — this cause cannot be acted on</span>'],
      ['Action', escapeHtml(c.action)],
      ['Measured loss', `<b>${inr(c.measured_loss_inr_per_day)}</b> per day`],
      ['Expected recovery', money],
      ['Basis', `<span class="q">${escapeHtml(c.recovery_basis)}</span>`],
      ['Owner', c.owner ? c.owner.replace(/_/g,' ')
        : '<span class="na">unowned</span>'],
      ['Confidence', escapeHtml(c.confidence_band)],
    ].map(([k,v]) => `<tr><th scope="row">${k}</th><td>${v}</td></tr>`).join('');

    const m = c.monitoring;
    const approval = c.approval ? `
      <div class="approval">
        <p><span class="tag">Awaiting approval</span>
        Drafted for <b>${escapeHtml(c.approval.assigned_to.replace(/_/g,' '))}</b>.
        Nothing has been changed.</p>
        <p class="q">${escapeHtml(c.approval.body)}</p>
      </div>` : '';

    const caveats = c.caveats.length
      ? `<ul class="caveats">${c.caveats.map(x=>`<li>${escapeHtml(x)}</li>`).join('')}</ul>`
      : '';

    return `
      <article class="decision">
        <h3>${escapeHtml(c.cause)}</h3>
        <p class="verdictline">
          <span class="mark ${c.controllable?'ok':'na'}">${c.controllable?'●':'·'}</span>
          ${c.controllable ? 'Verified and actionable' : 'Verified, but nothing to act on'}
        </p>
        <table class="chain">${chain}</table>
        ${caveats}
        <div class="monitor">
          <h4>Monitoring rule</h4>
          <table class="chain">
            <tr><th scope="row">Watch</th><td>${escapeHtml(m.watch)}</td></tr>
            <tr><th scope="row">Threshold</th><td>${escapeHtml(m.threshold)}</td></tr>
            <tr><th scope="row">Window</th><td>${escapeHtml(m.window)}</td></tr>
            <tr><th scope="row">Route to</th><td>${escapeHtml(m.route_to.replace(/_/g,' '))}</td></tr>
          </table>
        </div>
        ${approval}
      </article>`;
  }).join('');

  return section('The decision', rows, true,
    `${cards.length} card${cards.length>1?'s':''}`);
}

/* The run as a receipt. It exists to make the architectural claim checkable:
   how long each stage took, and how much of it a model did. */
function receiptBlock(){
  const t = STATE.diagnosis && STATE.diagnosis.telemetry;
  if(!t) return '';
  const rows = t.stages.map(s => `
    <tr><td>${escapeHtml(s.stage)}</td>
        <td>${escapeHtml(s.method_class)}</td>
        <td class="num">${s.ms.toFixed(1)}</td>
        <td class="num">${s.model_calls}</td>
        <td class="q">${s.note ? escapeHtml(s.note) : ''}</td></tr>`).join('');
  const tot = t.totals;
  return section('Run receipt', `
    <table>
      <thead><tr><th>Stage</th><th>Method</th><th class="num">ms</th>
        <th class="num">Model calls</th><th>Note</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><th>Total</th><th></th>
        <th class="num">${tot.ms.toFixed(1)}</th>
        <th class="num">${tot.model_calls}</th>
        <th></th></tr></tfoot>
    </table>
    <p class="q">${(tot.deterministic_share*100).toFixed(1)}% of the time was
    spent outside a model call. Narrative produced by:
    ${escapeHtml(t.narrative_by)}. Cost ${inr(tot.cost_inr)}.</p>`,
    false, `${tot.ms.toFixed(0)} ms · ${tot.model_calls} model calls`);
}

function chartMarkup(){
  return `<div class="strip">
    <div class="charthead">
      <h2>Observed against what a normal day should have looked like</h2>
      <span class="zoomnote" id="zoomnote"></span>
      <button id="zoomreset" hidden>Reset</button>
    </div>
    <canvas id="c"></canvas>
    <div class="scrubber" id="scrub" title="Drag to move through the series"
      role="scrollbar" aria-label="Visible period"><div class="scrubwin" id="scrubwin"></div></div>
    <div class="tip" id="tip"></div>
    <div class="striplegend">
      <span style="color:var(--ink)"><i></i>Observed</span>
      <span style="color:var(--ink-3)"><i></i>Expected</span>
      <span style="color:var(--down)"><i></i>Flagged</span>
      <span style="margin-left:auto">Scroll to zoom · shift-scroll or drag to move · hover to read</span>
    </div></div>`;
}

function movementsBlock(){
  const rows = STATE.series.anomalies.slice().sort((a,b)=>a.day<b.day?1:-1).map(a=>`
    <tr><td><code>${a.day}</code></td>
      <td><span class="pill ${a.direction==='drop'?'no':'ok'}">${a.direction}</span></td>
      <td class="n ${a.delta<0?'down':'up'}">${a.delta<0?'\u2212':'+'}${inr(a.delta)}</td>
      <td class="n ${a.delta<0?'down':'up'}">${pct(a.pct)}</td>
      <td class="n">${a.robust_z>0?'+':''}${a.robust_z.toFixed(2)}</td></tr>`).join('');
  return section('Days that passed both materiality tests',
    `<p>The series is split by MSTL into trend, weekly rhythm and the retail
     calendar, and anomalies are measured on what is left over using the median
     and MAD rather than the mean, so an earlier shock does not raise the bar for
     the next one. A day appears here only if it is statistically unusual
     <em>and</em> the movement is large enough in rupees to be worth acting on.
     Both tests must pass: significance alone surfaces movements too small to act
     on, and size alone surfaces noise that happens to be large.</p>
     <div class="scroll"><table><thead><tr><th>Day</th><th>Direction</th>
     <th class="n">Shortfall</th><th class="n">Change</th><th class="n">Robust z</th></tr></thead>
     <tbody>${rows}</tbody></table></div>`, false, STATE.series.anomalies.length);
}

function decompositionBlock(){
  const d = STATE.decomposition;
  if(!d) return '';
  const meaning={volume:'how much was sold',mix:'which products sold',price:'realised price'};
  const legs = d.bridge.legs.map(l=>`<tr><td>${l.leg}</td>
    <td class="muted">${meaning[l.leg]}</td>
    <td class="n ${l.value<0?'down':'up'}">${l.value<0?'−':'+'}${inr(l.value)}</td>
    <td class="n">${pct(l.share)}</td></tr>`).join('');
  const dims = d.contributions.map(c=>{
    const rows = c.slices.map(s=>`<tr><td>${s.value}</td>
      <td class="n ${s.delta<0?'down':'up'}">${s.delta<0?'−':'+'}${inr(s.delta)}</td>
      <td class="n ${s.pct_change<0?'down':'up'}">${s.pct_change==null?'':pct(s.pct_change)}</td>
      <td class="n">${pct(s.share)}</td></tr>`).join('');
    return `<p style="margin-top:22px"><strong>By ${c.dimension}</strong>
      <span class="muted">· largest carries ${(c.concentration_top1*100).toFixed(0)}%</span></p>
      <div class="scroll"><table><thead><tr><th>${c.dimension}</th><th class="n">Change</th>
      <th class="n">Within slice</th><th class="n">Share</th></tr></thead>
      <tbody>${rows}</tbody></table></div>`;
  }).join('');

  return section('How the movement breaks down',
    `<p>Revenue is units times price, so only three things can move it. These are
     arithmetic rather than estimates, and they add back to the total exactly.</p>
     <div class="scroll"><table><thead><tr><th>Effect</th><th></th>
     <th class="n">Per day</th><th class="n">Share</th></tr></thead><tbody>${legs}
     <tr><td><strong>total</strong></td><td class="muted">observed movement</td>
     <td class="n ${d.bridge.total_change<0?'down':'up'}"><strong>${d.bridge.total_change<0?'−':'+'}${inr(d.bridge.total_change)}</strong></td>
     <td class="n">100.0%</td></tr>
     <tr><td class="muted">residual</td><td class="muted">${d.bridge.reconciles?'the three reconcile exactly':'DOES NOT RECONCILE'}</td>
     <td class="n muted">₹${d.bridge.residual}</td><td></td></tr></tbody></table></div>
     ${dims}`);
}

function candidatesBlock(){
  const c = STATE.candidates;
  if(!c) return '';
  const order=['verified','rejected','cannot_verify'];
  const label={verified:['ok','Verified'],rejected:['no','Rejected'],cannot_verify:['na','Not testable']};
  const items = order.flatMap(k=>c[k].map(x=>{
    const [cls,word]=label[k];
    const tests = x.tests.map(t=>`<tr><td style="width:104px"><span class="pill">${t.outcome==='unavailable'?'n/a':t.outcome}</span></td>
      <td style="width:200px">${t.name.replace(/_/g,' ')}</td>
      <td class="muted">${t.detail}</td></tr>`).join('');
    return `<div style="padding:18px 0;border-bottom:1px solid var(--line)">
      <div style="display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:6px">
        <span class="pill ${cls}">${word}</span><code>${x.candidate_id}</code></div>
      <p style="margin-bottom:10px">${x.description||''}</p>
      <p style="margin-bottom:10px"><strong>${x.reason}</strong></p>
      <div class="scroll"><table><tbody>${tests}</tbody></table></div></div>`;
  })).join('');
  return section('Everything that was considered',
    `<p>Candidates come from the operational record with nothing marking which are
     real. One becomes a claim only by surviving every test that could be run, and
     a test that could not run is not a test that passed.</p>${items}`,
    false, `${c.counts.verified} verified · ${c.counts.rejected} rejected`);
}

function freshnessBlock(){
  const rows = STATE.series.freshness.map(f=>`<tr><td><code>${f.source_id}</code></td>
    <td>${f.as_of.slice(0,16).replace('T',' ')}</td>
    <td class="n">${f.lag_hours}h</td><td class="n">${f.sla_hours}h</td>
    <td>${f.sla_met?'<span class="pill ok">within SLA</span>':'<span class="pill no">breached</span>'}</td></tr>`).join('');
  return section('Where the data came from',
    `<p>When each source last landed, against what it promised. A breach reduces
     confidence and is stated in the finding rather than hidden here.</p>
     <div class="scroll"><table><thead><tr><th>Source</th><th>Last landed</th>
     <th class="n">Lag</th><th class="n">SLA</th><th>Status</th></tr></thead>
     <tbody>${rows}</tbody></table></div>`);
}

/* ---------- evidence drawer ---------- */
function wireClaims(){
  document.querySelectorAll('.claim').forEach(b=>
    b.addEventListener('click',()=>openDrawer(b.dataset)));
}

function openDrawer({cause,panel}){
  const d = STATE.diagnosis;
  let html = '';
  if(cause){
    const c = d.verified.find(v=>v.candidate_id===cause);
    html = `<h3>${plain(c)}</h3>
      <p class="muted"><code>${c.candidate_id}</code></p>
      <dl class="field"><dt>Effect in the slice it touched</dt>
        <dd class="down">${pct(c.effect_pct)}</dd></dl>
      <dl class="field"><dt>Share of the movement</dt>
        <dd>${inr(c.contribution)} per day</dd></dl>
      <dl class="field"><dt>Where</dt>
        <dd>${c.exposed_regions.join(', ')||'everywhere'}${
          Object.values(c.scope).length?' · '+Object.values(c.scope).join(' / '):''}</dd></dl>
      <dl class="field"><dt>How it was tested</dt><dd>
        <table><tbody>${c.tests.map(t=>`<tr>
          <td style="width:76px"><span class="pill">${t.outcome==='unavailable'?'n/a':t.outcome}</span></td>
          <td class="muted">${t.detail}</td></tr>`).join('')}</tbody></table></dd></dl>
      <dl class="field"><dt>In the company's own words${
        c.citations.some(x=>x.flags.length)?' <span class="pill na">contains instruction-like text, read as data</span>':''}</dt>
        <dd>${c.citations.length ? c.citations.map(x=>`
          <div class="quote">${x.quote}
          <cite><button class="linkback" data-doc="${x.doc_id}">${x.doc_id}</button>
          · characters ${x.span[0]}\u2013${x.span[1]} · open the record</cite></div>`).join('')
          : '<span class="muted">Nothing in the record describes this.</span>'}</dd></dl>`;
  } else if(panel==='confidence'){
    html = `<h3>How the score was reached</h3>
      <p class="muted">Arithmetic over evidence already established. Not a judgement,
      and not written by a model.</p>
      <table style="margin-top:18px"><tbody>${d.confidence.components.map(x=>`<tr>
        <td style="width:150px">${x.name.replace(/_/g,' ')}</td>
        <td class="n" style="width:60px">${(x.value*100).toFixed(0)}%</td>
        <td class="muted">${x.detail}</td></tr>`).join('')}</tbody></table>
      <p class="muted" style="margin-top:20px">This is deliberately not presented as a
      probability. Turning it into one requires held-out cases to calibrate against,
      and stating a probability without them would be the failure this engine exists
      to avoid.</p>`;
  } else if(panel==='ruledout'){
    html = `<h3>Considered and ruled out</h3>
      <table style="margin-top:16px"><tbody>${d.abstention.ruled_out.map(r=>`<tr>
        <td style="width:150px"><code>${r.candidate}</code></td>
        <td><span class="pill">${r.verdict.replace(/_/g,' ')}</span>
        <div class="muted" style="margin-top:4px">${r.reason}</div></td></tr>`).join('')}
      </tbody></table>`;
  }
  $('#dbody').innerHTML = html;
  wireDocLinks();
  $('#drawer').hidden = false;
  requestAnimationFrame(()=>{ $('#drawer').classList.add('on'); $('#scrim').classList.add('on'); });
  $('#dclose').focus();
}

function wireDocLinks(){
  $('#dbody').querySelectorAll('[data-doc]').forEach(b=>
    b.addEventListener('click',()=>showDocument(b.dataset.doc)));
}

/* The whole record behind a citation. A quotation with a character range is only
   checkable if the reader can open the document and see the range in place. */
async function showDocument(docId){
  const back = $('#dbody').innerHTML;
  const r = await fetch('/api/document/'+encodeURIComponent(docId));
  if(!r.ok){ return; }
  const d = await r.json();
  $('#dbody').innerHTML = `
    <p class="eyebrow"><button class="linkback" id="docback">Back to the finding</button></p>
    <h3>${d.doc_id}</h3>
    <p class="muted">${d.doc_type.replace(/_/g,' ')} · ${d.region} ·
      ${d.ts.slice(0,16).replace('T',' ')} · ${d.length} characters</p>
    ${d.injection_flags.length ? `<p class="pill na" style="margin-top:14px;display:inline-block">
      Contains instruction-like text: ${d.injection_flags.join(', ')}. Read as data.</p>` : ''}
    <dl class="field"><dt>Full record, exactly as written</dt>
      <dd><pre style="white-space:pre-wrap">${escapeHtml(d.text)}</pre></dd></dl>
    <p class="muted">This is the untrusted source. Nothing inside it is treated as
      an instruction, and the engine quotes from it rather than paraphrasing.</p>`;
  $('#docback').addEventListener('click',()=>{ $('#dbody').innerHTML = back; wireDocLinks(); });
}

const escapeHtml = t => t.replace(/[&<>]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[ch]));

function closeDrawer(){
  $('#drawer').classList.remove('on'); $('#scrim').classList.remove('on');
  setTimeout(()=>{ $('#drawer').hidden = true; }, 180);
}
$('#dclose').addEventListener('click',closeDrawer);
$('#scrim').addEventListener('click',closeDrawer);
addEventListener('keydown',e=>{ if(e.key==='Escape' && !$('#drawer').hidden) closeDrawer(); });

/* ---------- chart ----------
   A chart of a movement should let a reader look at the movement. Zooming and
   panning change only the window on screen; the analysis behind the page is
   unaffected, so what is being examined never silently changes underneath. */
let VIEW = null;   // {lo, hi} indices into the series, or null for the whole span

function viewBounds(){
  const n = STATE.series.days.length;
  if(!VIEW) return {lo:0, hi:n-1};
  return {lo:Math.max(0,Math.round(VIEW.lo)), hi:Math.min(n-1,Math.round(VIEW.hi))};
}

function drawChart(){
  const c=$('#c'); if(!c || !STATE.series) return;
  const dpr=devicePixelRatio||1, w=c.clientWidth, h=190;
  if(!w) return;
  c.width=w*dpr; c.height=h*dpr;
  const x=c.getContext('2d'); x.scale(dpr,dpr); x.clearRect(0,0,w,h);
  const css=getComputedStyle(document.documentElement), col=n=>css.getPropertyValue(n).trim();

  const d=STATE.series, {lo,hi}=viewBounds(), span=Math.max(hi-lo,1);
  const PL=8,PR=8,PT=10,PB=20, W=w-PL-PR, H=h-PT-PB;
  const slice=a=>a.slice(lo,hi+1);
  const all=[...slice(d.observed),...slice(d.band_low),...slice(d.band_high)];
  let ylo=Math.min(...all), yhi=Math.max(...all); const pad=(yhi-ylo)*.08||1;
  ylo-=pad; yhi+=pad;
  const X=i=>PL+((i-lo)/span)*W, Y=v=>PT+H-((v-ylo)/(yhi-ylo))*H;
  CHART={X,Y,lo,hi,span,W,PL,PR,ylo,yhi,h,w};

  x.fillStyle=col('--raised'); x.beginPath();
  for(let i=lo;i<=hi;i++) i===lo?x.moveTo(X(i),Y(d.band_high[i])):x.lineTo(X(i),Y(d.band_high[i]));
  for(let i=hi;i>=lo;i--) x.lineTo(X(i),Y(d.band_low[i]));
  x.closePath(); x.fill();

  x.strokeStyle=col('--ink-3'); x.lineWidth=1; x.setLineDash([2,3]); x.beginPath();
  for(let i=lo;i<=hi;i++) i===lo?x.moveTo(X(i),Y(d.expected[i])):x.lineTo(X(i),Y(d.expected[i]));
  x.stroke(); x.setLineDash([]);

  x.strokeStyle=col('--ink'); x.lineWidth=1.4; x.beginPath();
  for(let i=lo;i<=hi;i++) i===lo?x.moveTo(X(i),Y(d.observed[i])):x.lineTo(X(i),Y(d.observed[i]));
  x.stroke();

  const idx=new Map(d.days.map((day,i)=>[day,i]));
  d.anomalies.forEach(a=>{ const i=idx.get(a.day); if(i==null||i<lo||i>hi) return;
    x.fillStyle=col(a.direction==='drop'?'--down':'--up');
    x.beginPath(); x.arc(X(i),Y(a.observed),3,0,7); x.fill(); });

  if(HOVER!=null && HOVER>=lo && HOVER<=hi){
    x.strokeStyle=col('--line-strong'); x.lineWidth=1; x.beginPath();
    x.moveTo(X(HOVER),PT); x.lineTo(X(HOVER),PT+H); x.stroke();
    x.fillStyle=col('--ink'); x.beginPath(); x.arc(X(HOVER),Y(d.observed[HOVER]),3.4,0,7); x.fill();
  }

  x.fillStyle=col('--ink-3'); x.font='11px '+col('--mono');
  x.textAlign='left';  x.fillText(d.days[lo],PL,h-5);
  x.textAlign='right'; x.fillText(d.days[hi],w-PR,h-5);

  const note=$('#zoomnote'), reset=$('#zoomreset'), win=$('#scrubwin');
  // Name the points by the contract's grain. Calling hourly conversion samples
  // "days" overstates the history by a factor of twenty-four.
  const unit = (d.grain || 'day') + (d.days.length === 1 ? '' : 's');
  if(note){ note.textContent = VIEW
    ? `${d.days[lo]} to ${d.days[hi]} · ${span+1} of ${d.days.length.toLocaleString()} ${unit}`
    : ''; }
  if(reset){ reset.hidden = !VIEW; }
  if(win){
    const total=d.days.length-1 || 1;
    win.style.left = (lo/total*100) + '%';
    win.style.width = Math.max((span/total*100), 2) + '%';
  }
}

let CHART=null, HOVER=null, DRAG=null, CHART_OBSERVER=null, SCRUBBING=false;

function bindChart(){
  const c=$('#c'); if(!c) return;

  // A canvas measured at zero width draws nothing and, without this, never gets
  // a second chance: the details block may be closed, the pane hidden, or the
  // window not yet laid out when the first draw happens.
  if(CHART_OBSERVER) CHART_OBSERVER.disconnect();
  CHART_OBSERVER = new ResizeObserver(() => { if(c.clientWidth) drawChart(); });
  CHART_OBSERVER.observe(c);

  const n=()=>STATE.series.days.length;
  const atX=px=>Math.round(CHART.lo + ((px-CHART.PL)/CHART.W)*CHART.span);

  c.addEventListener('mousemove',e=>{
    if(!CHART) return;
    const r=c.getBoundingClientRect(), px=e.clientX-r.left;
    if(DRAG){
      const shift=(DRAG.px-px)/CHART.W*CHART.span;
      const width=VIEW.hi-VIEW.lo;
      let lo=DRAG.lo+shift, hi=DRAG.hi+shift;
      if(lo<0){ lo=0; hi=width; }
      if(hi>n()-1){ hi=n()-1; lo=hi-width; }
      VIEW={lo,hi}; drawChart(); return;
    }
    HOVER=Math.max(CHART.lo,Math.min(CHART.hi,atX(px)));
    showTip(e.clientY-r.top);
    drawChart();
  });
  c.addEventListener('mouseleave',()=>{ HOVER=null; $('#tip').classList.remove('on'); drawChart(); });

  c.addEventListener('wheel',e=>{
    if(!CHART) return;
    e.preventDefault();

    // A trackpad swipe sideways, or shift with a wheel, moves through time
    // rather than zooming. Both are what a reader reaches for without thinking.
    const sideways = e.shiftKey || Math.abs(e.deltaX) > Math.abs(e.deltaY);
    if(sideways){
      const amount = (e.shiftKey ? e.deltaY : e.deltaX) / CHART.W * CHART.span;
      panBy(amount);
      return;
    }

    const r=c.getBoundingClientRect(), anchor=atX(e.clientX-r.left);
    const factor=e.deltaY>0?1.18:1/1.18;
    const {lo,hi}=viewBounds();
    let newLo=anchor-(anchor-lo)*factor, newHi=anchor+(hi-anchor)*factor;
    if(newHi-newLo < 6) return;                 // stop zooming into nothing
    if(newHi-newLo >= n()-1){ VIEW=null; drawChart(); return; }
    VIEW={lo:Math.max(0,newLo), hi:Math.min(n()-1,newHi)};
    drawChart();
  }, {passive:false});

  // The scrubber shows where the visible window sits in the whole series, and
  // moves it. Zooming without one leaves the reader with no idea where they are.
  const scrub=$('#scrub');
  if(scrub){
    const jump=e=>{
      const {lo,hi}=viewBounds(), width=hi-lo;
      if(width >= n()-1) return;
      const r=scrub.getBoundingClientRect();
      const centre=((e.clientX-r.left)/r.width)*(n()-1);
      let newLo=centre-width/2, newHi=centre+width/2;
      if(newLo<0){ newLo=0; newHi=width; }
      if(newHi>n()-1){ newHi=n()-1; newLo=newHi-width; }
      VIEW={lo:newLo,hi:newHi}; drawChart();
    };
    scrub.addEventListener('mousedown',e=>{ SCRUBBING=true; scrub.classList.add('on'); jump(e); });
    addEventListener('mousemove',e=>{ if(SCRUBBING) jump(e); });
    addEventListener('mouseup',()=>{ SCRUBBING=false; scrub.classList.remove('on'); });
  }

  c.addEventListener('mousedown',e=>{
    if(!VIEW) return;                            // nothing to pan at full extent
    const r=c.getBoundingClientRect();
    DRAG={px:e.clientX-r.left, lo:VIEW.lo, hi:VIEW.hi};
    c.classList.add('panning');
  });
  addEventListener('mouseup',()=>{ DRAG=null; c.classList.remove('panning'); });

  const reset=$('#zoomreset');
  if(reset) reset.addEventListener('click',()=>{ VIEW=null; drawChart(); });
}

function panBy(amount){
  const n = STATE.series.days.length;
  const {lo,hi} = viewBounds();
  const width = hi - lo;
  if(width >= n-1) return;                      // nothing to move at full extent
  let newLo = lo + amount, newHi = hi + amount;
  if(newLo < 0){ newLo = 0; newHi = width; }
  if(newHi > n-1){ newHi = n-1; newLo = newHi - width; }
  VIEW = {lo:newLo, hi:newHi};
  drawChart();
}

function showTip(mouseY){
  const t=$('#tip'), d=STATE.series;
  if(HOVER==null){ t.classList.remove('on'); return; }
  const observed=d.observed[HOVER], expected=d.expected[HOVER];
  const gap=observed-expected, z=d.robust_z[HOVER];
  const flagged=d.anomalies.find(a=>a.day===d.days[HOVER]);
  const money=v=>STATE.overview && false ? v : inr(v);
  t.innerHTML = `<b>${d.days[HOVER]}</b><br>
    observed <b>${money(observed)}</b><br>
    expected <b>${money(expected)}</b><br>
    <span class="${gap<0?'down':'up'}">${gap<0?'\u2212':'+'}${money(gap)}
    · z ${z>0?'+':''}${z.toFixed(2)}</span>
    ${flagged?'<br><span class="pill no">flagged</span>':''}`;
  const px=CHART.X(HOVER);
  t.style.left = Math.min(Math.max(px+14, 8), CHART.w-150) + 'px';
  t.style.top  = Math.max(mouseY-10, 8) + 'px';
  t.classList.add('on');
}

addEventListener('resize',()=>STATE.series&&drawChart());
boot();
</script>
</body>
</html>
