[project]
name = "whychain"
version = "0.1.0"
description = "Evidence-backed diagnosis engine for business metric movements"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["invariant: hard correctness invariants that must never regress"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # import order
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "DTZ",           # timezone-aware datetimes — freshness arithmetic depends on it
    "SIM",           # simplification
    "RUF",
]
ignore = ["E501"]    # line length is formatted, not linted

[tool.ruff.lint.per-file-ignores]
# FastAPI declares request metadata through argument defaults; that is the
# framework's interface, not the mutable-default bug B008 is written for.
"api/*.py" = ["B008"]
