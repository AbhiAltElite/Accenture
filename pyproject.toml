[project]
name = "whychain"
version = "0.1.0"
description = "Evidence-backed diagnosis engine for business metric movements"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["invariant: hard correctness invariants that must never regress"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # import order
    "UP",            # pyupgrade
    "B",             # bugbear
    "C4",            # comprehensions
    "DTZ",           # timezone-aware datetimes, freshness arithmetic depends on it
    "SIM",           # simplification
    "RUF",
]
ignore = ["E501"]    # line length is formatted, not linted

[tool.ruff.lint.per-file-ignores]
# FastAPI declares request metadata through argument defaults; that is the
# framework's interface, not the mutable-default bug B008 is written for.
"api/*.py" = ["B008"]
# U+2212 MINUS SIGN is the correct glyph for a negative currency figure, and
# "−₹39,486" is the only rendering of a loss a finance reader should be shown.
# RUF001 exists to catch a hyphen typo'd as a dash; here the dash is the intent,
# so it is ignored where money is formatted and asserted, and nowhere else.
"whychain/narrate/brief.py" = ["RUF001"]
"tests/test_narrate.py" = ["RUF001"]
