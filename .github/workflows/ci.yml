name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first: the older run is cancelled rather than
# left to finish against a commit nobody is looking at any more.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 matches the pinned environment; 3.12 is the floor declared in
        # pyproject, tested so that claim stays true.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      # Three access-policy tests construct a `Warehouse` directly and fail
      # rather than skip when the file is absent, and roughly twenty more skip
      # themselves for the same reason -- so CI was testing markedly less than a
      # developer's `make test` does. Generating the dataset is the repository's
      # own documented first step; running it here means the suite CI reports on
      # is the suite that was written.
      - name: Generate the warehouse
        run: PYTHONPATH=. python -m datagen.build

      - name: Test
        run: pytest -q

      - name: Correctness invariants
        # Called out separately so a break here is obvious in the checks list.
        # These must never be skipped or relaxed to pass, see CONTRIBUTING.
        run: pytest -m invariant -q

  attribution:
    name: Attribution
    # The submission must read as the team's own work. This fails the build
    # rather than leaving it to be noticed the day the repo goes public.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: No AI attribution in commit history
        run: ./.github/scripts/check-attribution.sh
