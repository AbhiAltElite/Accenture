name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.14 matches the pinned environment; 3.12 is the floor declared in
        # pyproject, tested so that claim stays true.
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      # Three access-policy tests construct a `Warehouse` directly and fail
      # rather than skip when the file is absent, and roughly twenty more skip
      # themselves for the same reason -- so CI was testing markedly less than a
      # developer's `make test` does. Generating the dataset is the repository's
      # own documented first step; running it here means the suite CI reports on
      # is the suite that was written.
      - name: Generate the warehouse
        run: PYTHONPATH=. python -m datagen.build

      - name: Test
        run: pytest -q

      - name: Correctness invariants
        # Called out separately so a break here is obvious in the checks list.
        # These must never be skipped or relaxed to pass, see CONTRIBUTING.
        run: pytest -m invariant -q

  attribution:
    # The submission must read as the team's own work. This fails the build
    # rather than leaving it to be noticed the day the repo goes public.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No AI attribution in commit history
        run: |
          # The tool names are matched on their own, because every real
          # attribution carries one -- a trailer naming an assistant, or a
          # generated-by line pointing at its website. The generated-by phrase
          # is only matched when a tool name follows it, so a commit message
          # that merely discusses the wording in English is not mistaken for
          # one that carries it. That mistake failed this job twice.
          pattern='claude|anthropic|copilot|chatgpt|co-authored-by|generated (with|by) [^ ]*(claude|copilot|chatgpt|gemini|cursor|codex)'
          if git log --format='%an%n%ae%n%B' | grep -iE "$pattern"; then
            echo "::error::AI attribution found in commit history"
            exit 1
          fi
          echo "Commit history clean."
